<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CRISAT - 2026 | 2029 </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #0284c7; --accent: #0ea5e9; --bg: #f1f5f9; --text: #334155; --border: #cbd5e1; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; color: var(--text); }
        
        .form-container, .table-container { 
            background: white; padding: 30px; border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 1200px; margin: 0 auto 30px auto; 
        }

        .header-crisat { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        legend { font-weight: 800; color: var(--primary); padding: 0 12px; font-size: 0.85rem; text-transform: uppercase; }

        .field { display: flex; flex-direction: column; gap: 5px; }
        .full-width { grid-column: 1 / -1; }
        label { font-size: 0.8rem; font-weight: 700; }
        input, select, textarea { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; }
        input:disabled, select:disabled { background-color: #f1f5f9; cursor: not-allowed; opacity: 0.6; }

        /* Estilos de Alertas en Tabla */
        .alerta-roja { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 4px; border: 1px solid #f87171; font-weight: bold; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 5px; }
        .tag-festivo { background: #fef9c3; color: #854d0e; padding: 4px 8px; border-radius: 4px; border: 1px solid #facc15; font-weight: bold; font-size: 0.75rem; }
        .asistencia-ok { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }

        .services-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; grid-column: 1 / -1; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 20px; }
        th { background-color: var(--primary); color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }

        .btn-save { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; text-transform: uppercase; display: flex; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-crisat">
        <h2>SISTEMA CRISAT</h2>
        <small>Expediente Clínico y Agenda de Terapias</small>
    </div>

    <form id="formCrisat">
        <input type="hidden" id="editIndex" value="-1">
        
        <!-- BLOQUE 1: ADMINISTRATIVO -->
        <fieldset>
            <legend><i class="fas fa-calendar-alt"></i> Control Administrativo</legend>
            <div class="field"><label>Fecha de Captura</label><input type="date" id="fecha_captura" readonly></div>
            <div class="field"><label>Fecha de Cita</label><input type="date" id="fecha_cita" required></div>
            <div class="field"><label>Hora de Cita</label><input type="time" id="hora_cita" required></div>
            <div class="field"><label>Estatus de Cita</label>
                <select id="estatus" onchange="toggleCamposEspeciales()">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Asistió">Asistió</option>
                    <option value="Faltó">Faltó</option>
                    <option value="Día Festivo">Día Festivo</option>
                </select>
            </div>
            <div class="field" id="box_justificante" style="display:none;">
                <label style="color:red;">¿Trajo Justificante?</label>
                <select id="justificante"><option value="No">No</option><option value="Si">Si</option></select>
            </div>
            <div class="field"><label>No. Expediente</label><input type="text" id="expediente" placeholder="CR-0000"></div>
            <div class="field"><label>Tipo de Atención</label>
                <select id="tipo_atencion"><option value="1ra vez">1ra Vez</option><option value="subsecuente">Subsecuente</option></select>
            </div>
        </fieldset>

        <!-- BLOQUE 2: PERSONALES (COMPLETO) -->
        <fieldset>
            <legend><i class="fas fa-user-injured"></i> Datos del Paciente</legend>
            <div class="field full-width"><label>Nombre Completo</label><input type="text" id="nombre" placeholder="Nombre completo"></div>
            <div class="field"><label>Sexo</label><select id="sexo"><option value="H">Hombre</option><option value="M">Mujer</option></select></div>
            <div class="field"><label>F. Nacimiento</label><input type="date" id="fecha_nacimiento" onchange="calcularEdad()"></div>
            <div class="field"><label>Edad</label><input type="number" id="edad" readonly></div>
            <div class="field"><label>Municipio</label><input type="text" id="municipio" value="San Andrés Tuxtla"></div>
            <div class="field full-width"><label>Dirección</label><input type="text" id="direccion"></div>
        </fieldset>

        <!-- BLOQUE 3: CLÍNICO (COMPLETO) -->
        <fieldset>
            <legend><i class="fas fa-notes-medical"></i> Valoración Clínica</legend>
            <div class="field full-width"><label>Diagnóstico</label><textarea id="diagnostico" rows="2"></textarea></div>
            <div class="field"><label>¿Presenta Discapacidad?</label>
                <select id="discapacidad" onchange="toggleDiscapacidad()"><option value="no">No</option><option value="si">Sí</option></select>
            </div>
            <div class="field"><label>Tipo Discapacidad</label>
                <select id="tipo_discapacidad" disabled><option value="Motora">Motora</option><option value="Auditivo">Auditivo</option><option value="Intelectual">Intelectual</option><option value="Lenguaje">Lenguaje</option></select>
            </div>
            <div class="field"><label>Grado</label>
                <select id="grado" disabled><option value="Leve">Leve</option><option value="Moderado">Moderado</option><option value="Severo">Severo</option></select>
            </div>
            <div class="field"><label>Duración</label>
                <select id="duracion" disabled><option value="Temporal">Temporal</option><option value="Permanente">Permanente</option></select>
            </div>
        </fieldset>

        <!-- BLOQUE 4: TERAPIAS ORIGINALES -->
        <fieldset>
            <legend>Terapias</legend>
            <div class="services-container">
                <div class="checkbox-item"><input type="checkbox" class="t-check" value="Hidroterapias"><label>Hidroterapias</label></div>
                <div class="checkbox-item"><input type="checkbox" class="t-check" value="Compresas"><label>Compresas</label></div>
                <div class="checkbox-item"><input type="checkbox" class="t-check" value="Parafina"><label>Parafina</label></div>
                <div class="checkbox-item"><input type="checkbox" class="t-check" value="Crioterapia"><label>Crioterapia</label></div>
                <div class="checkbox-item"><input type="checkbox" class="t-check" value="Mecanoterapia"><label>Mecanoterapia</label></div>
                <div class="checkbox-item"><input type="checkbox" class="t-check" value="Terapia Ocupacional"><label>Terapia Ocupacional</label></div>
            </div>
        </fieldset>

        <!-- BLOQUE 5: ELECTRO ORIGINALES -->
        <fieldset>
            <legend>Electro Terapia</legend>
            <div class="services-container">
                <div class="checkbox-item"><input type="checkbox" class="e-check" value="Electro terapia"><label>Electro terapia</label></div>
                <div class="checkbox-item"><input type="checkbox" class="e-check" value="Ultrasonido"><label>Ultrasonido</label></div>
                <div class="checkbox-item"><input type="checkbox" class="e-check" value="Laser"><label>Laser</label></div>
            </div>
        </fieldset>

        <button type="button" class="btn-save" id="btnAction" onclick="guardarRegistro()">
            <i class="fas fa-save"></i> GUARDAR Y ACTUALIZAR AGENDA
        </button>
    </form>
</div>

<div class="table-container">
    <table id="tablaGeneral">
        <thead>
            <tr>
                <th>F. Captura</th>
                <th>F. Cita / Hora</th>
                <th>Expediente</th>
                <th>Paciente</th>
                <th>Estatus / Alerta</th>
                <th>Terapias</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>
</div>

<script>
    let registros = JSON.parse(localStorage.getItem('crisat_v_total')) || [];

    document.getElementById('fecha_captura').valueAsDate = new Date();

    function toggleDiscapacidad() {
        const si = document.getElementById("discapacidad").value === "si";
        ["tipo_discapacidad", "grado", "duracion"].forEach(id => document.getElementById(id).disabled = !si);
    }

    function toggleCamposEspeciales() {
        const est = document.getElementById("estatus").value;
        document.getElementById("box_justificante").style.display = (est === "Faltó") ? "block" : "none";
    }

    function calcularEdad() {
        const f = document.getElementById("fecha_nacimiento").value;
        if (f) {
            let edad = (new Date()).getFullYear() - (new Date(f)).getFullYear();
            document.getElementById("edad").value = edad;
        }
    }

    function guardarRegistro() {
        const idx = parseInt(document.getElementById('editIndex').value);
        const data = {
            fCap: document.getElementById('fecha_captura').value,
            fCit: document.getElementById('fecha_cita').value,
            hora: document.getElementById('hora_cita').value,
            est: document.getElementById('estatus').value,
            just: document.getElementById('justificante').value,
            exp: document.getElementById('expediente').value,
            tipoA: document.getElementById('tipo_atencion').value,
            nom: document.getElementById('nombre').value,
            sexo: document.getElementById('sexo').value,
            fNac: document.getElementById('fecha_nacimiento').value,
            edad: document.getElementById('edad').value,
            mun: document.getElementById('municipio').value,
            dir: document.getElementById('direccion').value,
            diag: document.getElementById('diagnostico').value,
            disc: document.getElementById('discapacidad').value,
            tDisc: document.getElementById('tipo_discapacidad').value,
            grad: document.getElementById('grado').value,
            dura: document.getElementById('duracion').value,
            ter: [...document.querySelectorAll('.t-check:checked, .e-check:checked')].map(c => c.value).join(', ')
        };

        if(!data.nom || !data.fCit) return alert("Nombre y Fecha de Cita son obligatorios.");

        if(idx === -1) registros.push(data);
        else { registros[idx] = data; document.getElementById('editIndex').value = "-1"; }

        localStorage.setItem('crisat_v_total', JSON.stringify(registros));
        document.getElementById('formCrisat').reset();
        document.getElementById('fecha_captura').valueAsDate = new Date();
        toggleDiscapacidad();
        toggleCamposEspeciales();
        mostrar();
    }

    function mostrar() {
        const cuerpo = document.getElementById('cuerpoTabla');
        cuerpo.innerHTML = "";
        registros.sort((a,b) => new Date(a.fCit + ' ' + a.hora) - new Date(b.fCit + ' ' + b.hora));

        registros.forEach((r, i) => {
            let alertTag = "";
            if(r.est === "Faltó") {
                alertTag = r.just === "No" 
                    ? `<span class="alerta-roja"><i class="fas fa-exclamation-triangle"></i> SIN JUSTIFICANTE</span>` 
                    : `<span class="asistencia-ok">Faltó con Justificante</span>`;
            } else if(r.est === "Día Festivo") {
                alertTag = `<span class="tag-festivo">FESTIVO</span>`;
            } else if(r.est === "Asistió") {
                alertTag = `<span class="asistencia-ok">ASISTIÓ</span>`;
            } else {
                alertTag = `<span>Pendiente</span>`;
            }

            cuerpo.innerHTML += `<tr>
                <td><small>${r.fCap}</small></td>
                <td><strong>${r.fCit}</strong><br>${r.hora}</td>
                <td>${r.exp}</td>
                <td><strong>${r.nom}</strong><br><small>${r.mun}</small></td>
                <td>${alertTag}</td>
                <td><small>${r.ter}</small></td>
                <td>
                    <button style="color:orange;border:none;background:none;cursor:pointer" onclick="editar(${i})"><i class="fas fa-edit"></i></button>
                    <button style="color:red;border:none;background:none;cursor:pointer" onclick="borrar(${i})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
    }

    function editar(i) {
        const r = registros[i];
        document.getElementById('editIndex').value = i;
        document.getElementById('fecha_captura').value = r.fCap;
        document.getElementById('fecha_cita').value = r.fCit;
        document.getElementById('hora_cita').value = r.hora;
        document.getElementById('estatus').value = r.est;
        toggleCamposEspeciales();
        document.getElementById('justificante').value = r.just;
        document.getElementById('expediente').value = r.exp;
        document.getElementById('tipo_atencion').value = r.tipoA;
        document.getElementById('nombre').value = r.nom;
        document.getElementById('sexo').value = r.sexo;
        document.getElementById('fecha_nacimiento').value = r.fNac;
        document.getElementById('edad').value = r.edad;
        document.getElementById('municipio').value = r.mun;
        document.getElementById('direccion').value = r.dir;
        document.getElementById('diagnostico').value = r.diag;
        document.getElementById('discapacidad').value = r.disc;
        toggleDiscapacidad();
        document.getElementById('tipo_discapacidad').value = r.tDisc;
        document.getElementById('grado').value = r.grad;
        document.getElementById('duracion').value = r.dura;
        
        document.querySelectorAll('.t-check, .e-check').forEach(c => {
            c.checked = r.ter.split(', ').includes(c.value);
        });
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function borrar(i) { if(confirm("¿Eliminar registro?")) { registros.splice(i,1); localStorage.setItem('crisat_v_total', JSON.stringify(registros)); mostrar(); } }

    window.onload = mostrar;
</script>
</body>
</html>
