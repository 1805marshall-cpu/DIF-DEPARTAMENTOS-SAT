<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF 2026 | Población Vulnerable</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #0d9488; --primary-dark: #0f766e; --success: #059669; 
            --warning: #f59e0b; --danger: #dc2626; --bg: #f8fafc; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: #1e293b; font-size: 13px; }
        header { background: #fff; padding: 15px 40px; border-bottom: 3px solid var(--primary); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header-title h2 { margin: 0; color: var(--primary); font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .container { max-width: 1850px; margin: 20px auto; padding: 0 20px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        h3 { margin: 0 0 18px 0; font-size: 11px; color: var(--primary); text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; letter-spacing: 1px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        input, select { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.1); }
        .foto-field { grid-column: 1 / -1; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; display: flex; align-items: center; gap: 15px; }
        .img-preview { width: 60px; height: 40px; background: #fff; border-radius: 4px; overflow: hidden; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; }
        .img-preview img { width: 100%; height: 100%; object-fit: cover; }
        .btn-box { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: 0.3s; }
        .search-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; gap: 15px; align-items: flex-end; }
        .table-wrap { background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1700px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 10px; color: #475569; border-bottom: 2px solid var(--border); text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .sub-text { font-size: 10px; color: #64748b; display: block; margin-top: 2px; }
        .badge-status { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .paginacion-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        .btn-pag { padding: 6px 12px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer; font-size: 11px; }
        #modal-visor { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; text-align: center; max-width: 80%; position: relative;}
        .close-x { position: absolute; top: 10px; right: 20px; font-size: 25px; cursor: pointer; color: #64748b; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print">
    <div class="header-title"><h2><i class="fas fa-hand-holding-heart"></i> Pob. Vulnerable</h2></div>
    <button class="btn" style="background: var(--primary)" onclick="location.href='admin_global.html'"><i class="fa-solid fa-house"></i> DASHBOARD</button>
</header>

<div class="container">
    <div class="card no-print">
        <h3><i class="fas fa-folder-plus"></i> Registro de Expediente</h3>
        <input type="hidden" id="edit-id">
        <div class="form-grid" id="main-form">
            <div class="form-group"><label>Código</label><input type="text" id="codigo" placeholder="ID-2026"></div>
            <div class="form-group"><label>Tipo de Apoyo</label><input type="text" id="tipo_apoyo"></div>
            <div class="form-group"><label>Fecha Ingreso</label><input type="date" id="fecha_ingreso"></div>
            <div class="form-group"><label>Paterno</label><input type="text" id="apellido_paterno"></div>
            <div class="form-group"><label>Materno</label><input type="text" id="apellido_materno"></div>
            <div class="form-group"><label>Nombre(s)</label><input type="text" id="nombre"></div>
            <div class="form-group"><label>F. Nacimiento (Número o Formato)</label><input type="text" id="fecha_nac" placeholder="Ej: 15051990"></div>
            <div class="form-group">
                <label>Edad Calculada</label>
                <input type="text" id="edad_calculada" readonly style="background: #f1f5f9; font-weight: bold; color: var(--primary);">
                <span id="mensaje_programa" style="font-size: 9px; font-weight: bold; margin-top: 4px; padding: 2px 5px; border-radius: 4px; display: none;"></span>
            </div>            
            <div class="form-group"><label>CURP</label><input type="text" id="curp" maxlength="18"></div>
            <div class="form-group">
                <label>Estatus</label>
                <select id="estatus">
                    <option value="Pendiente">PENDIENTE</option>
                    <option value="Entregado">ENTREGADO</option>
                </select>
            </div>
            <div class="form-group"><label>Clave Entidad</label><input type="text" id="clave_entidad"></div>
            <div class="form-group"><label>Entidad</label><input type="text" id="entidad"></div>
            <div class="form-group"><label>Cve Mpio</label><input type="text" id="cve_mpio"></div>
            <div class="form-group"><label>Municipio</label><input type="text" id="municipio"></div>
            <div class="form-group"><label>Clave Col/Loc</label><input type="text" id="clave_col_loc"></div>
            <div class="form-group"><label>Colonia/Loc</label><input type="text" id="col_loc"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Dirección</label><input type="text" id="direccion"></div>
            <div class="form-group"><label>Teléfono</label><input type="text" id="telefono"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Observaciones</label><input type="text" id="observaciones"></div>
            
            <div class="foto-field">
                <div style="flex-grow: 1;">
                    <label><i class="fas fa-camera"></i> Adjuntar INE / Evidencia</label>
                    <input type="file" accept="image/*" onchange="handleFoto(event)" style="width: 100%; margin-top: 5px;">
                </div>
                <div class="img-preview" id="box-preview"><i class="fas fa-image" style="color:#cbd5e1; font-size: 20px;"></i></div>
                <input type="hidden" id="ine_img">
            </div>
        </div>

        <div class="btn-box">
            <button class="btn" id="btn-save" style="background:var(--success)" onclick="guardar()"><i class="fas fa-save"></i> GUARDAR</button>
            <button class="btn" id="btn-upd" style="background:var(--warning); display:none;" onclick="actualizar()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
            <button class="btn" style="background:#1d6f42" onclick="exportarExcel()"><i class="fas fa-file-excel"></i> EXPORTAR</button>
            <button class="btn" style="background:#94a3b8" onclick="location.reload()"><i class="fas fa-eraser"></i> LIMPIAR</button>
        </div>
    </div>

<div class="search-box no-print" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
    <div class="form-group"><label>🔍 Código</label><input type="text" id="f-cod" onkeyup="filtrarAvanzado()" placeholder="ID..."></div>
    <div class="form-group"><label>👤 Nombre/Apellido</label><input type="text" id="f-nom" onkeyup="filtrarAvanzado()" placeholder="Nombre..."></div>
    <div class="form-group"><label>📍 Localidad</label><input type="text" id="f-loc" onkeyup="filtrarAvanzado()" placeholder="Colonia..."></div>
    <div class="form-group">
        <label>🎁 Apoyo</label>
        <select id="f-apo" onchange="filtrarAvanzado()">
            <option value="">TODOS</option>
            <option value="LACTANTE">LACTANTE</option>
            <option value="EMBARAZADA">EMBARAZADA</option>
            <option value="ESCOLAR">ESCOLAR</option>
            <option value="DISCAPACIDAD">DISCAPACIDAD</option>
        </select>
    </div>
    <div class="form-group">
        <label>🚩 Estatus</label>
        <select id="f-est" onchange="filtrarAvanzado()">
            <option value="">TODOS</option>
            <option value="Pendiente">PENDIENTE</option>
            <option value="Entregado">ENTREGADO</option>
        </select>
    </div>
    <div class="form-group" style="justify-content: flex-end;">
        <button class="btn" style="background:#64748b; width:100%" onclick="limpiarFiltros()"><i class="fas fa-filter-circle-xmark"></i> LIMPIAR</button>
    </div>
</div>

   <div class="paginacion-bar no-print">
    <div style="display: flex; align-items: center; gap: 8px;">
        <label style="font-size: 10px; color: #64748b;">MOSTRAR:</label>
        <select id="selector-filas" onchange="cambiarFilas(this.value)" style="padding: 2px 5px; font-size: 11px;">
            <option value="10">10</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="500">500</option>
        </select>
    </div>
    <div id="info-total" style="font-size: 11px; font-weight: bold; color: var(--primary);"></div>
    <div id="pag-container"></div>
</div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>NO.</th><th>FOTO</th><th>CÓDIGO</th><th>BENEFICIARIO</th><th>F. NACIMIENTO</th><th>LOCALIDAD / DIRECCIÓN</th><th>APOYO</th><th>ESTATUS</th><th class="no-print">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tabla-beneficiarios"></tbody>
        </table>
    </div>
</div>

<div id="modal-visor" onclick="cerrarVisor()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-x" onclick="cerrarVisor()">&times;</span>
        <h4 id="visor-titulo" style="margin:0 0 10px 0; color:var(--primary);"></h4>
        <img id="img-grande" style="max-width:100%; max-height:70vh; border-radius:5px;">
        <div class="btn-box" style="justify-content:center;">
            <a id="link-descarga" download="evidencia.jpg" href="#"><button class="btn" style="background:var(--primary)">📥 DESCARGAR</button></a>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, query, orderBy, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCk6vNVA6mkYzcqdgSBE2akIMVkXYOwq0E", projectId: "poblacion-vulnerable---dif" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const apoyosRef = collection(db, "apoyos");

    let DATA_ACTUAL = [];
    let DATA_FILTRADA = [];
    let PAGINA_ACTUAL = 1;
    let FILAS_POR_PAGINA = 50;

    // Escucha en tiempo real
    onSnapshot(query(apoyosRef, orderBy("codigo", "asc")), (snap) => {
        DATA_ACTUAL = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        window.filtrarAvanzado(); 
    });

    // --- UTILIDADES DE FORMULARIO ---
    window.limpiarFormulario = () => {
        document.getElementById('edit-id').value = "";
        document.querySelectorAll('#main-form input, #main-form select').forEach(i => i.value = "");
        document.getElementById('box-preview').innerHTML = '<i class="fas fa-image" style="color:#cbd5e1; font-size: 20px;"></i>';
        document.getElementById('btn-save').style.display = 'inline-block';
        document.getElementById('btn-upd').style.display = 'none';
        document.getElementById('edad_calculada').style.color = "#1e293b";
    };

    // --- CÁLCULO DE EDAD ---
    window.calcularEdadActual = () => {
        const inputFecha = document.getElementById('fecha_nac').value.trim();
        const apoyo = document.getElementById('tipo_apoyo').value.toUpperCase();
        const codigo = document.getElementById('codigo').value.toUpperCase();
        const output = document.getElementById('edad_calculada');
        
        if (!inputFecha) { output.value = ""; return; }

        let clean = inputFecha.replace(/\D/g, ''); 
        let d, m, a;
        if (clean.length === 8) {
            if (parseInt(clean.substring(0, 4)) > 1900) { a = clean.substring(0, 4); m = clean.substring(4, 6); d = clean.substring(6, 8); }
            else { d = clean.substring(0, 2); m = clean.substring(2, 4); a = clean.substring(4, 8); }
        } else {
            const p = inputFecha.split(/[-./ ]/);
            if(p.length === 3) {
                if(p[0].length === 4) { a=p[0]; m=p[1]; d=p[2]; }
                else { d=p[0]; m=p[1]; a=p[2]; }
            }
        }

        const fNac = new Date(a, m - 1, d);
        const hoy = new Date();
        if (isNaN(fNac.getTime()) || fNac > hoy) { output.value = "Fecha Inválida"; return; }

        let diffAnios = hoy.getFullYear() - fNac.getFullYear();
        let diffMeses = hoy.getMonth() - fNac.getMonth();
        if (hoy.getDate() < fNac.getDate()) diffMeses--;
        if (diffMeses < 0) { diffAnios--; diffMeses += 12; }

        output.value = `${diffAnios} AÑOS, ${diffMeses} MESES`;

        // Validación Programa 1000 Días
        const esLactante = codigo.includes("1000DIAS") && apoyo.includes("LACTANTE");
        if (esLactante) {
            const limite2Anios = 2 * 365.25 * 24 * 60 * 60 * 1000;
            output.style.color = (hoy - fNac < limite2Anios) ? "var(--success)" : "var(--danger)";
        } else {
            output.style.color = "var(--primary)";
        }
    };

    document.getElementById('fecha_nac').addEventListener('input', window.calcularEdadActual);
    document.getElementById('tipo_apoyo').addEventListener('input', window.calcularEdadActual);

    // --- FILTRADO AVANZADO ---
    window.filtrarAvanzado = () => {
        const fCod = document.getElementById('f-cod').value.toLowerCase();
        const fNom = document.getElementById('f-nom').value.toLowerCase();
        const fLoc = document.getElementById('f-loc').value.toLowerCase();
        const fApo = document.getElementById('f-apo').value;
        const fEst = document.getElementById('f-est').value;

        DATA_FILTRADA = DATA_ACTUAL.filter(r => {
            const full = `${r.nombre} ${r.apellido_paterno} ${r.apellido_materno}`.toLowerCase();
            return (r.codigo || "").toLowerCase().includes(fCod) &&
                   full.includes(fNom) &&
                   (r.col_loc || "").toLowerCase().includes(fLoc) &&
                   (fApo === "" || r.tipo_apoyo === fApo) &&
                   (fEst === "" || r.estatus === fEst);
        });
        PAGINA_ACTUAL = 1;
        render();
    };

    window.limpiarFiltros = () => {
        ['f-cod', 'f-nom', 'f-loc', 'f-apo', 'f-est'].forEach(id => document.getElementById(id).value = "");
        window.filtrarAvanzado();
    };

    // --- RENDERIZADO ---
    function render() {
        const inicio = (PAGINA_ACTUAL - 1) * FILAS_POR_PAGINA;
        const lista = DATA_FILTRADA.slice(inicio, inicio + FILAS_POR_PAGINA);
        document.getElementById('info-total').innerText = `TOTAL: ${DATA_FILTRADA.length}`;
        
        document.getElementById('tabla-beneficiarios').innerHTML = lista.map((r, i) => `
            <tr>
                <td><b>${DATA_FILTRADA.length - (inicio + i)}</b></td>
                <td>${r.ine_img ? `<img src="${r.ine_img}" onclick="abrirVisor('${r.ine_img}', '${r.nombre}')" style="width:35px;height:35px;object-fit:cover;cursor:pointer;border-radius:4px;">` : '-'}</td>
                <td style="color:var(--primary); font-weight:bold;">${r.codigo || ''}</td>
                <td><b>${r.apellido_paterno || ''} ${r.apellido_materno || ''} ${r.nombre || ''}</b><span class="sub-text">${r.curp || ''}</span></td>
                <td>${r.fecha_nac || ''} <br> <small style="color:var(--primary); font-weight:bold;">${r.edad_calculada || ''}</small></td>
                <td><b>${r.col_loc || ''}</b><span class="sub-text">${r.direccion || ''}</span></td>
                <td>${r.tipo_apoyo || ''}</td>
                <td><span class="badge-status" style="background:${r.estatus==='Entregado'?'#dcfce7':'#fef3c7'}; color:${r.estatus==='Entregado'?'#15803d':'#b45309'}">${r.estatus}</span></td>
                <td class="no-print">
                    <button onclick="editar('${r.id}')" title="Editar">✏️</button>
                    <button onclick="eliminar('${r.id}')" title="Eliminar">🗑️</button>
                </td>
            </tr>
        `).join('');

        const tPag = Math.ceil(DATA_FILTRADA.length / FILAS_POR_PAGINA);
        document.getElementById('pag-container').innerHTML = `
            <button class="btn-pag" onclick="irPagina(${PAGINA_ACTUAL-1})" ${PAGINA_ACTUAL===1?'disabled':''}>Anterior</button>
            <span style="margin:0 10px">Pág ${PAGINA_ACTUAL} de ${tPag||1}</span>
            <button class="btn-pag" onclick="irPagina(${PAGINA_ACTUAL+1})" ${PAGINA_ACTUAL>=tPag?'disabled':''}>Siguiente</button>
        `;
    }

    window.irPagina = (p) => { PAGINA_ACTUAL = p; render(); };
    window.cambiarFilas = (v) => { FILAS_POR_PAGINA = parseInt(v); render(); };

    // --- CRUD ---
    window.guardar = async () => {
        const d = {};
        document.querySelectorAll('#main-form input, #main-form select').forEach(i => { if(i.id) d[i.id] = i.value; });
        if(!d.codigo) return alert("Código requerido");
        try {
            await addDoc(apoyosRef, d);
            alert("¡Registro guardado con éxito!");
            window.limpiarFormulario();
        } catch (e) { alert("Error al guardar"); }
    };

    window.actualizar = async () => {
        const id = document.getElementById('edit-id').value;
        const d = {};
        document.querySelectorAll('#main-form input, #main-form select').forEach(i => { if(i.id) d[i.id] = i.value; });
        try {
            await updateDoc(doc(db, "apoyos", id), d);
            alert("¡Actualizado!");
            window.limpiarFormulario();
        } catch (e) { alert("Error al actualizar"); }
    };

    window.editar = (id) => {
        const r = DATA_ACTUAL.find(x => x.id === id);
        if (!r) return;
        Object.keys(r).forEach(key => {
            const el = document.getElementById(key);
            if (el) el.value = r[key] || "";
        });
        if (r.ine_img) {
            document.getElementById('box-preview').innerHTML = `<img src="${r.ine_img}" style="width:100%">`;
            document.getElementById('ine_img').value = r.ine_img;
        }
        document.getElementById('edit-id').value = id;
        document.getElementById('btn-save').style.display = 'none'; 
        document.getElementById('btn-upd').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.eliminar = async (id) => { if(confirm("¿Seguro que desea eliminar este registro?")) await deleteDoc(doc(db, "apoyos", id)); };

    // --- EXPORTAR ---
 window.exportarExcel = () => {
    if (DATA_FILTRADA.length === 0) return alert("No hay datos para exportar.");

    // 1. Definimos el orden exacto y el nombre de la cabecera
    // El orden en este objeto será el orden de las columnas en Excel
    const estructuraColumnas = {
        codigo: "CÓDIGO",
        tipo_apoyo: "TIPO DE APOYO",
        fecha_ingreso: "FECHA INGRESO",
        nombre: "NOMBRE(S)",
        apellido_paterno: "APELLIDO PATERNO",
        apellido_materno: "APELLIDO MATERNO",
        fecha_nac: "F. NACIMIENTO",
        edad_calculada: "EDAD",
        curp: "CURP",
        estatus: "ESTATUS",
        col_loc: "COLONIA/LOCALIDAD",
        direccion: "DIRECCIÓN",
        telefono: "TELÉFONO",
        observaciones: "OBSERVACIONES"
    };

    // 2. Transformamos la data filtrada al nuevo formato ordenado
    const dataOrdenada = DATA_FILTRADA.map((registro, index) => {
        let fila = { "NO.": index + 1 }; // Agregamos contador
        
        // Iteramos sobre nuestra estructura para asegurar el orden
        Object.keys(estructuraColumnas).forEach(llave => {
            const nombreColumna = estructuraColumnas[llave];
            fila[nombreColumna] = registro[llave] || ""; // Asignamos valor o vacío
        });
        
        return fila;
    });

    // 3. Creamos el libro y la hoja
    const ws = XLSX.utils.json_to_sheet(dataOrdenada);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Beneficiarios");

    // 4. Descarga
    const fechaPersonalizada = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `Reporte_Poblacion_${fechaPersonalizada}.xlsx`);
};

    // --- IMPORTAR ---
    window.importarSincronizado = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async (evt) => {
            const workbook = XLSX.read(evt.target.result, { type: 'binary' });
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            if(!confirm(`¿Importar ${json.length} registros?`)) return;
            const batch = writeBatch(db);
            json.forEach(f => {
                const newRef = doc(apoyosRef);
                batch.set(newRef, {
                    codigo: String(f.CÓDIGO || f.codigo || ""),
                    nombre: String(f.NOMBRE || f.nombre || ""),
                    apellido_paterno: String(f.PATERNO || f.apellido_paterno || ""),
                    apellido_materno: String(f.MATERNO || f.apellido_materno || ""),
                    tipo_apoyo: String(f.APOYO || f.tipo_apoyo || ""),
                    estatus: f.ESTATUS || f.estatus || "Pendiente",
                    curp: String(f.CURP || f.curp || ""),
                    col_loc: String(f["COLONIA/LOC"] || f.col_loc || ""),
                    direccion: String(f.DIRECCION || f.direccion || "")
                });
            });
            await batch.commit();
            alert("Importación exitosa");
        };
        reader.readAsBinaryString(file);
    };

    // --- UI UTILIDADES ---
    window.handleFoto = (e) => {
        const fr = new FileReader();
        fr.onload = (ev) => { 
            document.getElementById('ine_img').value = ev.target.result; 
            document.getElementById('box-preview').innerHTML = `<img src="${ev.target.result}" style="width:100%">`; 
        };
        fr.readAsDataURL(e.target.files[0]);
    };

    window.abrirVisor = (src, n) => {
        document.getElementById('modal-visor').style.display='flex'; 
        document.getElementById('img-grande').src = src; 
        document.getElementById('visor-titulo').innerText = n;
        document.getElementById('link-descarga').href = src;
    };
    window.cerrarVisor = () => document.getElementById('modal-visor').style.display='none';
    
    window.vaciarBaseDeDatos = async () => {
        if(!confirm("⚠️ ADVERTENCIA: Se borrarán TODOS los datos permanentemente. ¿Continuar?")) return;
        const snap = await getDocs(apoyosRef);
        const batch = writeBatch(db);
        snap.forEach(d => batch.delete(d.ref));
        await batch.commit();
        alert("Base de datos vaciada.");
    };
</script>
</body>
</html>
