<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF 2026 - 2029 | Procuraduría</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #1e40af; --success: #059669; --warning: #f59e0b; 
            --danger: #dc2626; --bg: #f8fafc; --procu: #1e3a8a; --excel: #1d6f42;
        }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: #1e293b; font-size: 13px; }
        header { background: #fff; padding: 15px 40px; border-bottom: 3px solid var(--procu); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .container { max-width: 1850px; margin: 20px auto; padding: 0 20px; }
        
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        h3 { margin: 0 0 15px 0; font-size: 11px; color: var(--procu); text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; letter-spacing: 1px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 3px; }
        input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--procu); box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.1); }
        
        .btn-box { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .search-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; gap: 15px; align-items: flex-end; }
        
        .table-wrap { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1400px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 10px; color: #475569; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover { background-color: #fcfcfc; }
        
        .paginacion-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .btn-pag { padding: 6px 12px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-pag:disabled { opacity: 0.5; cursor: not-allowed; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 20px;">
    <div style="display: flex; align-items: center; gap: 20px;">
        <h2 style="margin:0; color: var(--procu); font-size: 18px;">
            <i class="fas fa-balance-scale"></i> PROCURADURÍA DIF | SISTEMA 2026-2029
        </h2>
        <!-- Contenedor estilizado para el saludo del usuario activo -->
        <div id="user-display" style="font-size: 11px; font-weight: bold; color: #1e3a8a; background: #eff6ff; border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 6px; display: flex; align-items: center; gap: 6px;">
            <i class="fas fa-user-circle" style="font-size: 14px; color: #2563eb;"></i>
            <span id="user-text">Cargando usuario...</span>
        </div>
    </div>

    <!-- Grupo de botones de navegación y sesión -->
    <div style="display: flex; gap: 8px;">
        <button class="btn" style="background: var(--primary);" onclick="location.href='admin_global.html'">
            <i class="fa-solid fa-chart-pie"></i> DASHBOARD
        </button>
        <button class="btn" style="background: var(--danger);" onclick="cerrarSesion()">
            <i class="fas fa-sign-out-alt"></i> CERRAR SESIÓN
        </button>
    </div>
</header>

<div class="container">
<div class="card no-print">
    <h3 style="margin-bottom: 25px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">
        <i class="fas fa-folder-plus"></i> Registro de Expediente
    </h3>
    <input type="hidden" id="edit-id">
    
    <div class="form-grid" style="display: flex; flex-direction: column; gap: 20px;">
        
        <!-- SECCIÓN 1: DATOS GENERALES DEL EXPEDIENTE -->
        <fieldset style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background-color: #ffffff;">
            <legend style="padding: 0 15px; font-weight: 800; color: var(--primary); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">
                <i class="fas fa-id-card"></i> Información del Folio
            </legend>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                <div class="form-group">
                    <label>No.</label>
                    <input type="text" id="no" readonly style="background:#f8fafc; font-weight: bold; border: 1px solid #cbd5e1;">
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="fecha">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Nombre del Solicitante</label>
                    <input type="text" id="nombre" placeholder="Nombre completo">
                </div>
            </div>
        </fieldset>

        <!-- SECCIÓN 2: UBICACIÓN Y CONTACTO -->
        <fieldset style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background-color: #f8fafc;">
            <legend style="padding: 0 15px; font-weight: 800; color: #0ea5e9; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">
                <i class="fas fa-map-marker-alt"></i> Domicilio y Procedencia
            </legend>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                <div class="form-group">
                    <label>Domicilio</label>
                    <input type="text" id="domicilio" placeholder="Calle, número, etc.">
                </div>
                <div class="form-group">
                    <label>Lugar</label>
                    <input type="text" id="lugar" placeholder="Comunidad / Colonia">
                </div>
            </div>
        </fieldset>

        <!-- SECCIÓN 3: DETALLES JURÍDICOS / ASUNTO -->
        <fieldset style="border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; background-color: #ffffff;">
            <legend style="padding: 0 15px; font-weight: 800; color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">
                <i class="fas fa-gavel"></i> Información del Caso
            </legend>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div class="form-group" style="grid-column: span 2;">
                    <label>Asunto(s)</label>
                    <input type="text" id="asuntos" placeholder="Ej: Pensión Alimenticia, Guardia y Custodia...">
                </div>
                <div class="form-group">
                    <label>Horarios Mixtos</label>
                    <select id="horarios_mixtos">
                        <option value="No">No</option>
                        <option value="Si">Si</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 3;">
                    <label>Detalles y Observaciones</label>
                    <textarea id="detalles" rows="3" placeholder="Observaciones detalladas del caso..." style="width: 100%; resize: vertical;"></textarea>
                </div>
                <div class="form-group" style="grid-column: span 3;">
                    <label><i class="fas fa-pen-nib"></i> Elaboró:</label>
                    <input type="text" id="elaboro" placeholder="Nombre del servidor público">
                </div>
            </div>
        </fieldset>
    </div>

    <!-- BOTONERA -->
    <div class="btn-box" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #f1f5f9;">
        <button class="btn" id="btn-save" style="background:var(--success)" onclick="guardar()"><i class="fas fa-save"></i> GUARDAR</button>
        <button class="btn" id="btn-update" style="background:var(--warning); display:none;" onclick="actualizar()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
        <button class="btn" style="background:#64748b" onclick="limpiarForm()"><i class="fas fa-broom"></i> LIMPIAR</button>
    </div>
</div>

    <div class="search-box no-print">
        <div class="form-group" style="flex:2;">
            <label>🔎 Buscador Inteligente</label>
            <input type="text" id="buscador" placeholder="Escribe para buscar por cualquier campo..." onkeyup="filtrar()">
        </div>
        <div class="form-group" style="flex:1;">
            <label>Filas por página</label>
            <select id="rows-per-page" onchange="actualizarFilasPorPagina()">
                <option value="10" selected>10 registros</option>
                <option value="20">20 registros</option>
                <option value="50">50 registros</option>
                <option value="100">100 registros</option>
                <option value="500">500 registros</option>
            </select>
        </div>
    </div>

    <div class="paginacion-bar no-print">
        <div id="info-total" style="font-size: 11px; font-weight: bold; color: var(--procu);"></div>
        <div>
            <button class="btn-pag" id="btn-prev" onclick="cambiarPagina(-1)">« Anterior</button>
            <span id="page-info" style="margin: 0 15px; font-weight: bold;">Página 1</span>
            <button class="btn-pag" id="btn-next" onclick="cambiarPagina(1)">Siguiente »</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Fecha</th>
                    <th>Nombre</th>
                    <th>Domicilio</th>
                    <th>Lugar</th>
                    <th>Asuntos</th>
                    <th>Detalles</th>
                    <th>H. Mixtos</th>
                    <th>Elaboró</th>
                    <th class="no-print">Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCk6vNVA6mkYzcqdgSBE2akIMVkXYOwq0E",
        projectId: "poblacion-vulnerable---dif"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const dataRef = collection(db, "procuraduria");

    let todosLosDatos = [];
    let datosMostrados = [];
    let paginaActual = 1;
    let filasPorPagina = 10;
    let proximoNo = 1;

    // Configuración global de la sesión al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
        const sesionActiva = sessionStorage.getItem('sesion_activa');
        const nombreUsuario = sessionStorage.getItem('nombre_usuario');
        const departamento = sessionStorage.getItem('departamento');

        if (sesionActiva === 'true' && nombreUsuario) {
            document.getElementById('user-text').innerText = `BIENVENIDO: ${nombreUsuario.toUpperCase()} (${departamento || 'PROCURADURÍA'})`;
        } else {
            document.getElementById('user-text').innerText = "MODO: INVITADO";
        }
    });

    // Función global expuesta para cerrar la sesión de forma segura
    window.cerrarSesion = () => {
        if(confirm("¿Está seguro de que desea cerrar la sesión actual?")) {
            sessionStorage.clear();
            window.location.href = 'index.html'; // Cambia por el nombre exacto de tu archivo de Login si difiere
        }
    };

    onSnapshot(dataRef, (snapshot) => {
        todosLosDatos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if(todosLosDatos.length > 0) {
            const numeros = todosLosDatos.map(d => parseInt(d.no) || 0);
            proximoNo = Math.max(...numeros) + 1;
        } else { proximoNo = 1; }
        
        if(!document.getElementById('edit-id').value) {
            document.getElementById('no').value = proximoNo;
        }
        window.filtrar();
    });

    window.importarDesdeExcel = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                let count = 0;
                let currentMax = proximoNo;

                for (const f of json) {
                    const getV = (keys) => {
                        const found = Object.keys(f).find(k => keys.includes(k.trim().toUpperCase()));
                        return found ? f[found] : null;
                    };

                    let valorFecha = getV(["FECHA"]);
                    let fechaFinal = new Date().toISOString().split('T')[0];

                    if (valorFecha) {
                        if (valorFecha instanceof Date) {
                            fechaFinal = valorFecha.toISOString().split('T')[0];
                        } else if (!isNaN(valorFecha) && typeof valorFecha === 'number') {
                            const dateObj = new Date((valorFecha - 25569) * 86400 * 1000);
                            fechaFinal = dateObj.toISOString().split('T')[0];
                        } else {
                            fechaFinal = String(valorFecha);
                        }
                    }

                    await addDoc(dataRef, {
                        no: String(getV(["NO", "NUMERO", "FOLIO", "NO."]) || currentMax++),
                        fecha: fechaFinal,
                        nombre: String(getV(["NOMBRE"]) || "SIN NOMBRE").toUpperCase(),
                        domicilio: String(getV(["DOMICILIO"]) || "").toUpperCase(),
                        lugar: String(getV(["LUGAR", "LOCALIDAD", "COMUNIDAD"]) || "").toUpperCase(),
                        asuntos: String(getV(["ASUNTOS", "ASUNTO"]) || "").toUpperCase(),
                        detalles: String(getV(["DETALLES", "OBSERVACIONES"]) || ""),
                        horarios_mixtos: String(getV(["HORARIOS MIXTOS", "MIXTO"]) || "No"),
                        elaboro: String(getV(["ELABORO"]) || "IMPORTADO").toUpperCase(),
                        t: new Date().getTime()
                    });
                    count++;
                }
                alert(`✅ Importación exitosa: ${count} registros.`);
                e.target.value = "";
            } catch (err) {
                console.error(err);
                alert("Error al importar el archivo Excel.");
            }
        };
        reader.readAsArrayBuffer(file);
    };

    window.guardar = async () => {
        const data = obtenerValoresForm();
        if(!data.nombre) return alert("El nombre es obligatorio");
        data.t = new Date().getTime();
        await addDoc(dataRef, data);
        window.limpiarForm();
    };

    window.actualizar = async () => {
        const id = document.getElementById('edit-id').value;
        if(!id) return;
        await updateDoc(doc(db, "procuraduria", id), obtenerValoresForm());
        window.limpiarForm();
        alert("✅ Registro actualizado.");
    };

    window.borrarTodaLaBase = async () => {
        if (confirm("⚠️ ¿Desea eliminar TODA la información? Esta acción es irreversible.")) {
            const password = prompt("Escriba 'ELIMINAR' para confirmar:");
            if (password === "ELIMINAR") {
                const querySnapshot = await getDocs(dataRef);
                const batch = writeBatch(db);
                querySnapshot.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                alert("✅ Base de datos vaciada.");
            }
        }
    };

    window.eliminarDoc = async (id) => { 
        if(confirm("¿Seguro que desea eliminar este registro?")) {
            await deleteDoc(doc(db, "procuraduria", id)); 
        }
    };

    window.filtrar = () => {
        const term = document.getElementById('buscador').value.toLowerCase().trim();
        
        datosMostrados = todosLosDatos.filter(r => 
            Object.values(r).some(val => String(val).toLowerCase().includes(term))
        );

        datosMostrados.sort((a, b) => {
            const numA = parseInt(a.no) || 0;
            const numB = parseInt(b.no) || 0;
            return numB - numA;
        });
        
        paginaActual = 1; 
        renderTabla();
    };

    function renderTabla() {
        const totalRegistros = datosMostrados.length;
        const totalPag = Math.ceil(totalRegistros / filasPorPagina) || 1;
        
        if(paginaActual > totalPag) paginaActual = totalPag;
        if(paginaActual < 1) paginaActual = 1;

        const inicio = (paginaActual - 1) * filasPorPagina;
        const segmento = datosMostrados.slice(inicio, inicio + filasPorPagina);
        const tbody = document.getElementById('cuerpoTabla');
        
        document.getElementById('info-total').innerText = `TOTAL: ${totalRegistros} EXPEDIENTES`;
        document.getElementById('page-info').innerText = `Página ${paginaActual} de ${totalPag}`;
        
        document.getElementById('btn-prev').disabled = paginaActual === 1;
        document.getElementById('btn-next').disabled = paginaActual === totalPag;

        tbody.innerHTML = segmento.map(reg => `
            <tr>
                <td><span class="badge" style="background:#e0f2fe; color:#0369a1; padding:4px 8px; border-radius:4px; font-weight:bold;">${reg.no}</span></td>
                <td>${reg.fecha || ''}</td>
                <td><b>${reg.nombre || ''}</b></td>
                <td>${reg.domicilio || ''}</td>
                <td>${reg.lugar || ''}</td>
                <td style="color:var(--procu); font-weight:bold;">${reg.asuntos || ''}</td>
                <td style="max-width:300px; font-size:11px; color:#475569;">${reg.detalles || ''}</td>
                <td>${reg.horarios_mixtos || 'No'}</td>
                <td>${reg.elaboro || ''}</td>
                <td class="no-print">
                    <button class="btn" style="background:#fef3c7; color:#92400e; padding:5px 8px;" onclick="editarLocal('${reg.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn" style="background:#fee2e2; color:#991b1b; padding:5px 8px;" onclick="eliminarDoc('${reg.id}')"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    function obtenerValoresForm() {
        return {
            no: document.getElementById('no').value,
            fecha: document.getElementById('fecha').value,
            nombre: document.getElementById('nombre').value.toUpperCase(),
            domicilio: document.getElementById('domicilio').value.toUpperCase(),
            lugar: document.getElementById('lugar').value.toUpperCase(),
            asuntos: document.getElementById('asuntos').value.toUpperCase(),
            detalles: document.getElementById('detalles').value,
            horarios_mixtos: document.getElementById('horarios_mixtos').value,
            elaboro: document.getElementById('elaboro').value.toUpperCase()
        };
    }

    window.limpiarForm = () => {
        ['edit-id','fecha','nombre','domicilio','lugar','asuntos','detalles','elaboro'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('no').value = proximoNo;
        document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
        document.getElementById('btn-save').style.display = 'inline-block';
        document.getElementById('btn-update').style.display = 'none';
    };

    window.editarLocal = (id) => {
        const reg = todosLosDatos.find(r => r.id === id);
        if(!reg) return;
        document.getElementById('edit-id').value = id;
        document.getElementById('no').value = reg.no || '';
        document.getElementById('fecha').value = reg.fecha || '';
        document.getElementById('nombre').value = reg.nombre || '';
        document.getElementById('domicilio').value = reg.domicilio || '';
        document.getElementById('lugar').value = reg.lugar || '';
        document.getElementById('asuntos').value = reg.asuntos || '';
        document.getElementById('detalles').value = reg.detalles || '';
        document.getElementById('horarios_mixtos').value = reg.horarios_mixtos || 'No';
        document.getElementById('elaboro').value = reg.elaboro || '';
        document.getElementById('btn-save').style.display = 'none';
        document.getElementById('btn-update').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.cambiarPagina = (dir) => { 
        paginaActual += dir;
        renderTabla();
    };

    window.actualizarFilasPorPagina = () => {
        filasPorPagina = parseInt(document.getElementById('rows-per-page').value);
        paginaActual = 1;
        renderTabla();
    };

    window.exportarExcel = () => {
        const datosOrdenados = [...datosMostrados].sort((a, b) => (parseInt(a.no) || 0) - (parseInt(b.no) || 0));

        const datosExportar = datosOrdenados.map(r => ({
            "No.": r.no, 
            "Fecha": r.fecha,
            "Nombre": r.nombre, 
            "Domicilio": r.domicilio, 
            "Lugar": r.lugar,
            "Asuntos": r.asuntos, 
            "Detalles": r.detalles, 
            "Horarios Mixtos": r.horarios_mixtos, 
            "Elaboró": r.elaboro
        }));

        const ws = XLSX.utils.json_to_sheet(datosExportar);
        const wscols = [{wch: 6}, {wch: 12}, {wch: 35}, {wch: 30}, {wch: 25}, {wch: 25}, {wch: 45}, {wch: 15}, {wch: 20}];
        ws['!cols'] = wscols;

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Padron_Procuraduria");
        const fHoy = new Date().toISOString().split('T')[0];
        XLSX.writeFile(wb, `Reporte_Procuraduria_${fHoy}.xlsx`);
    };

    window.limpiarForm();
</script>
</body>
</html>
