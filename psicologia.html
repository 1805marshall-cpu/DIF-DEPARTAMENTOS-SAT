<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF 2026 | Psicología - Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #991b1b; --success: #059669; --warning: #f59e0b; --danger: #dc2626; 
            --bg: #f8fafc; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: #1e293b; font-size: 13px; }
        header { background: #fff; padding: 15px 40px; border-bottom: 3px solid var(--primary); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .container { max-width: 100%; margin: 20px auto; padding: 0 20px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--primary); }
        .btn-box { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
        .table-wrap { background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1600px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 9px; color: #475569; border-bottom: 2px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; font-size: 11px; }
        .filter-input { width: 100%; padding: 4px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 11px; box-sizing: border-box; }
        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 15px; background: #fff; }
        .btn-page { background: #fff; border: 1px solid #cbd5e1; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; color:var(--primary)"><i class="fas fa-brain"></i> PSICOLOGÍA DIF</h2>
    <button class="btn" style="background: var(--primary)" onclick="location.href='admin_global.html'"><i class="fas fa-house"></i> DASHBOARD</button>
</header>

<div class="container">
    <div class="card">
        <input type="hidden" id="f-id">
        <div class="form-grid">
            <div class="form-group"><label>No.</label><input type="number" id="f-no"></div>
            <div class="form-group"><label>Hora</label><input type="time" id="f-horario"></div>
            <div class="form-group"><label>Fecha</label><input type="date" id="f-fecha"></div>
            <div class="form-group"><label>Paciente</label><input type="text" id="f-paciente"></div>
            <div class="form-group"><label>Edad Paciente</label><input type="text" id="f-edad_p"></div>
            <div class="form-group"><label>Nombre Acompañante</label><input type="text" id="f-nombre_a"></div>
            <div class="form-group"><label>Edad Acompañante</label><input type="text" id="f-edad_a"></div>
            <div class="form-group"><label>Colonia / Localidad</label><input type="text" id="f-col_loc"></div>
            <div class="form-group"><label>Teléfono</label><input type="tel" id="f-telefono"></div>
            <div class="form-group"><label>Tema / Motivo</label><input type="text" id="f-tema"></div>
            <div class="form-group"><label>Usuario</label><input type="text" id="f-usuario"></div>
            <div class="form-group" style="grid-column: span 1;"><label>Observaciones</label><input type="text" id="f-observaciones"></div>
        </div>

        <div class="btn-box">
            <button class="btn" id="btn-save" style="background:var(--success)" onclick="saveData()"><i class="fas fa-save"></i> GUARDAR</button>
            <button class="btn" id="btn-update" style="background:var(--warning); display:none;" onclick="updateData()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
            <button class="btn" style="background:#4b5563" onclick="limpiarForm()"><i class="fas fa-broom"></i> LIMPIAR</button>
            
            <div style="margin-left:10px; display:flex; align-items:center; gap:5px; background:#f1f5f9; padding:5px 10px; border-radius:6px;">
                <label style="margin:0">MOSTRAR:</label>
                <select id="row-selector" onchange="resetPageAndRender()">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="all">TODO</option>
                </select>
            </div>
        </div>
    </div>

    <div id="pagination-top" class="pagination-container"></div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No.</th><th>HORA</th><th>FECHA</th><th>PACIENTE</th><th>EDAD P</th><th>NOMBRE A</th><th>EDAD A</th><th>COLONIA</th><th>TELÉFONO</th><th>TEMA</th><th>USUARIO</th><th>OBSERVACIONES</th><th>ACCIONES</th>
                </tr>
                <tr class="filter-row">
                    <th><input type="text" class="filter-input" data-col="no" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="horario" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="fecha" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="paciente" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="edad_p" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="nombre_a" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="edad_a" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="col_loc" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="telefono" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="tema" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="usuario" onkeyup="renderUI()"></th>
                    <th><input type="text" class="filter-input" data-col="observaciones" onkeyup="renderUI()"></th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div id="pagination-bottom" class="pagination-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCk6vNVA6mkYzcqdgSBE2akIMVkXYOwq0E", projectId: "poblacion-vulnerable---dif" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const mainRef = collection(db, "psicologia");

    const sesion = (sessionStorage.getItem('sesion_activa') || "INVITADO").toUpperCase();
    let dataList = [];
    let currentPage = 1;

    onSnapshot(query(mainRef, orderBy("no", "asc")), (snap) => {
        dataList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderUI();
        generarSiguienteNo();
    });

    window.renderUI = () => {
        const filters = Array.from(document.querySelectorAll('.filter-input'));
        let filteredData = [...dataList];
        
        filters.forEach(input => {
            const val = input.value.toUpperCase();
            const col = input.dataset.col;
            if (val) filteredData = filteredData.filter(d => String(d[col] || '').toUpperCase().includes(val));
        });

        const selector = document.getElementById('row-selector');
        const rowsPerPage = selector.value === "all" ? (filteredData.length || 1) : parseInt(selector.value);
        const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
        
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * rowsPerPage;
        const dataToShow = filteredData.slice(start, start + rowsPerPage);

        document.getElementById('table-body').innerHTML = dataToShow.map(d => `
            <tr>
                <td><b>${d.no || ''}</b></td>
                <td>${d.horario || ''}</td>
                <td>${d.fecha || ''}</td>
                <td><b>${d.paciente || ''}</b></td>
                <td>${d.edad_p || ''}</td>
                <td>${d.nombre_a || ''}</td>
                <td>${d.edad_a || ''}</td>
                <td>${d.col_loc || ''}</td>
                <td>${d.telefono || ''}</td>
                <td><small>${d.tema || ''}</small></td>
                <td><small>${d.usuario || ''}</small></td>
                <td><small>${d.observaciones || ''}</small></td>
                <td>
                    <button onclick="editMode('${d.id}')" style="border:none; background:none; cursor:pointer;">✏️</button>
                    <button onclick="delDoc('${d.id}')" style="border:none; background:none; cursor:pointer;">🗑️</button>
                </td>
            </tr>
        `).join('');

        const navHTML = `
            <button class="btn-page" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>Anterior</button>
            <span style="font-weight:bold">Página ${currentPage} de ${totalPages} (Total: ${filteredData.length})</span>
            <button class="btn-page" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Siguiente</button>
        `;
        document.getElementById('pagination-top').innerHTML = navHTML;
        document.getElementById('pagination-bottom').innerHTML = navHTML;
    };

    window.saveData = async () => {
        const data = getFormData();
        if(!data.paciente) return alert("Nombre de paciente requerido");
        await addDoc(mainRef, data);
        limpiarForm();
    };

    window.editMode = (id) => {
        const d = dataList.find(i => i.id === id);
        if(!d) return;
        document.getElementById('f-id').value = d.id;
        document.getElementById('f-no').value = d.no || "";
        document.getElementById('f-horario').value = d.horario || "";
        document.getElementById('f-fecha').value = d.fecha || "";
        document.getElementById('f-paciente').value = d.paciente || "";
        document.getElementById('f-edad_p').value = d.edad_p || "";
        document.getElementById('f-nombre_a').value = d.nombre_a || "";
        document.getElementById('f-edad_a').value = d.edad_a || "";
        document.getElementById('f-col_loc').value = d.col_loc || "";
        document.getElementById('f-telefono').value = d.telefono || "";
        document.getElementById('f-tema').value = d.tema || "";
        document.getElementById('f-usuario').value = d.usuario || sesion;
        document.getElementById('f-observaciones').value = d.observaciones || "";
        
        document.getElementById('btn-save').style.display = 'none';
        document.getElementById('btn-update').style.display = 'inline-block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.updateData = async () => {
        const id = document.getElementById('f-id').value;
        await updateDoc(doc(db, "psicologia", id), getFormData());
        alert("Registro actualizado");
        limpiarForm();
    };

    function getFormData() {
        return {
            no: Number(document.getElementById('f-no').value),
            horario: document.getElementById('f-horario').value,
            fecha: document.getElementById('f-fecha').value,
            paciente: document.getElementById('f-paciente').value.toUpperCase(),
            edad_p: document.getElementById('f-edad_p').value,
            nombre_a: document.getElementById('f-nombre_a').value.toUpperCase(),
            edad_a: document.getElementById('f-edad_a').value,
            col_loc: document.getElementById('f-col_loc').value.toUpperCase(),
            tema: document.getElementById('f-tema').value.toUpperCase(),
            telefono: document.getElementById('f-telefono').value,
            usuario: document.getElementById('f-usuario').value.toUpperCase(),
            observaciones: document.getElementById('f-observaciones').value.toUpperCase(),
            t: new Date().getTime()
        };
    }

    window.limpiarForm = () => {
        document.getElementById('f-id').value = "";
        document.getElementById('f-fecha').value = new Date().toISOString().split('T')[0];
        document.getElementById('f-usuario').value = sesion;
        ['f-horario','f-paciente','f-edad_p','f-nombre_a','f-edad_a','f-col_loc','f-telefono','f-tema', 'f-observaciones'].forEach(id => document.getElementById(id).value = "");
        document.getElementById('btn-save').style.display = 'inline-block';
        document.getElementById('btn-update').style.display = 'none';
        generarSiguienteNo();
    };

    function generarSiguienteNo() {
        const max = dataList.reduce((m, i) => Math.max(m, Number(i.no) || 0), 0);
        if(!document.getElementById('f-id').value) document.getElementById('f-no').value = max + 1;
    }

    window.changePage = (d) => { currentPage += d; renderUI(); };
    window.resetPageAndRender = () => { currentPage = 1; renderUI(); };
    window.delDoc = async (id) => { if(confirm("¿Eliminar registro?")) await deleteDoc(doc(db, "psicologia", id)); };

    window.limpiarForm();
</script>
</body>
</html>
