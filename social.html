<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF 2026 | Trabajo Social </title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --primary: #1e40af; --success: #059669; --warning: #f59e0b; 
            --danger: #dc2626; --bg: #f8fafc; --social: #1e40af; --excel: #1d6f42;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: #1e293b; font-size: 13px; }
        header { background: #fff; padding: 15px 40px; border-bottom: 3px solid var(--social); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .container { max-width: 1850px; margin: 20px auto; padding: 0 20px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        h3 { margin: 0 0 15px 0; font-size: 11px; color: var(--social); text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; letter-spacing: 1px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 3px; }
        input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--social); box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.1); }
        .btn-box { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .search-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; gap: 15px; align-items: flex-end; }
        .table-wrap { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1700px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 10px; color: #475569; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover { background-color: #fcfcfc; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .bg-atendido, .bg-realizado, .bg-validado { background: #dcfce7; color: #15803d; }
        .bg-entregado, .bg-en-proceso { background: #e0f2fe; color: #0369a1; }
        .bg-pendiente { background: #ff9849; color: #b45309; }
        .bg-cancelado { background: #f77979; color: #b40909; }
        .paginacion-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .btn-pag { padding: 6px 12px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .btn-pag:disabled { background: #e2e8f0; cursor: not-allowed; color: #94a3b8; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print">
    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
        <div style="display: flex; align-items: center; gap: 20px;">
            <h2 style="margin:0; color: var(--social); font-size: 18px;"><i class="fas fa-users-cog"></i> TRABAJO SOCIAL DIF</h2>
            <span id="bienvenida-usuario" style="font-size: 13px; font-weight: bold; color: #475569; background: #f1f5f9; padding: 6px 12px; border-radius: 20px; display: none;"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn" style="background: #6366f1;" onclick="location.href='admin_global.html'"><i class="fa-solid fa-chart-pie"></i> DASHBOARD</button>
            <button class="btn" style="background: var(--danger);" onclick="cerrarSesion()"><i class="fa-solid fa-sign-out-alt"></i> CERRAR SESIÓN</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="card no-print">
        <h3 style="margin-bottom: 25px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;"><i class="fas fa-folder-plus"></i> Registro de Casos y Apoyos</h3>
        <input type="hidden" id="edit-id">
        <input type="hidden" id="eliminar-foto-flag" value="false">
        
        <div class="form-grid" style="display: flex; flex-direction: column; gap: 20px;">
            <fieldset style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background-color: #ffffff;">
                <legend style="padding: 0 15px; font-weight: 800; color: var(--primary); font-size: 13px; text-transform: uppercase;"><i class="fas fa-user-circle"></i> Datos del Beneficiario</legend>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                    <div class="form-group"><label>No. Consecutivo</label><input type="text" id="numero_consecutivo" readonly style="background:#f8fafc; font-weight:bold;"></div>
                    <div class="form-group"><label>Fecha de Registro</label><input type="date" id="fecha_registro"></div>
                    <div class="form-group" style="grid-column: span 2;"><label>Nombre del Beneficiario</label><input type="text" id="nombre" placeholder="Nombre completo"></div>
                    <div class="form-group"><label>Teléfono</label><input type="tel" id="telefono" placeholder="294..."></div>
                    <div class="form-group"><label>Colonia/Localidad</label><input type="text" id="col_loc"></div>
                    <div class="form-group" style="grid-column: span 2;"><label>Dirección Exacta</label><input type="text" id="direccion"></div>
                </div>
            </fieldset>

            <fieldset style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background-color: #f8fafc;">
                <legend style="padding: 0 15px; font-weight: 800; color: var(--primary); font-size: 13px; text-transform: uppercase;"><i class="fas fa-hand-holding-heart"></i> Detalles del Trámite o Apoyo</legend>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                    <div class="form-group">
                        <label>Programa</label>
                        <select id="programa" onchange="actualizarAsuntos()">
                            <option value="">-- SELECCIONAR --</option>
                            <option value="SOLICITUD">SOLICITUD</option>
                            <option value="VISITA DOMICILIARIA">VISITA DOMICILIARIA</option>
                            <option value="ATENCION CIUDADANA">ATENCION CIUDADANA</option>
                            <option value="ESTUDIO SOCIOECONOMICO">ESTUDIO SOCIOECONOMICO</option>
                            <option value="V.D./E. SOCIOECONOMICO">VISITA DOMICILIARIA / ESTUDIO SOCIOECONOMICO</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Asunto</label><select id="asunto"><option value="">-- SELECCIONE PROGRAMA --</option></select></div>
                    <div class="form-group" id="container-detalle-especifico" style="display:none;"><label id="label-detalle">ESPECIFICACIÓN</label><select id="detalle_asunto"></select></div>
                    <div class="form-group"><label>Folio Expediente</label><input type="text" id="folio_expediente" placeholder="Opcional"></div>
                    <div class="form-group" style="grid-column: span 3;"><label>Detalles Específicos</label><input type="text" id="detalles" placeholder="Breve descripción"></div>
                </div>
            </fieldset>

            <fieldset style="border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; background-color: #ffffff;">
                <legend style="padding: 0 15px; font-weight: 800; color: #64748b; font-size: 13px; text-transform: uppercase;"><i class="fas fa-clipboard-check"></i> Estatus y Seguimiento</legend>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                    <div class="form-group">
                        <label>Estatus</label>
                        <select id="estatus" style="background: #fffbeb; font-weight: bold;">
                            <option value="PENDIENTE">PENDIENTE</option>
                            <option value="ATENDIDO">ATENDIDO</option>
                            <option value="ENTREGADO">ENTREGADO</option>
                            <option value="REALIZADO">REALIZADO</option>
                            <option value="CANCELADO">CANCELADO</option>
                            <option value="EN PROCESO">EN PROCESO</option>
                            <option value="VALIDADO">VALIDADO</option>
                        </select>
                    </div>
                    <div class="form-group"><label>H. Mixtos</label><select id="horarios_mixtos"><option value="NO">NO</option><option value="SI">SI</option></select></div>
                    <div class="form-group">
                        <label>Usuario que Atiende</label>
                        <select id="usuario">
                            <option value="">-- SELECCIONAR --</option>
                            <option value="JUANITA C. CAMPECHANO QUEZADA">JUANITA C. CAMPECHANO QUEZADA</option>
                            <option value="MONSERRAT PLATA FLORES">MONSERRAT PLATA FLORES</option>
                            <option value="J.C.C.Q. / M.P.F.">J.C.C.Q. / M.P.F.</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 3;"><label>Observaciones</label><input type="text" id="observaciones"></div>
                    <div class="form-group">
                        <label>Seleccionar Evidencia (Imagen)</label>
                        <input type="file" id="input_file" accept="image/*">
                        <small id="txt-compresion" style="color:var(--success); font-weight:bold; margin-top:4px; display:none;">⚡ Foto optimizada con éxito.</small>
                        <button type="button" id="btn-delete-photo" style="display:none; background:var(--danger); color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:10px; font-weight:bold; margin-top:8px; align-items:center; gap:5px; width:fit-content;" onclick="quitarFotoForm()">
                            <i class="fas fa-trash"></i> QUITAR FOTO ACTUAL
                        </button>
                    </div>                
                </div>
            </fieldset>
        </div>

        <div class="btn-box">
            <button class="btn" id="btn-save" style="background:var(--success)" onclick="subirYGuardar()"><i class="fas fa-save"></i> GUARDAR</button>   
            <button class="btn" id="btn-update" style="background:var(--warning); display:none;" onclick="actualizar()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
            <button class="btn" style="background:var(--excel)" onclick="exportarExcel()"><i class="fas fa-file-excel"></i> EXPORTAR</button>
            <button class="btn" style="background:#94a3b8" onclick="limpiarForm()"><i class="fas fa-eraser"></i> LIMPIAR</button>
        </div>
    </div>

    <div class="search-box no-print">
        <div class="form-group" style="flex:2;"><label>🔍 Buscador Global</label><input type="text" id="buscador" placeholder="Buscar..." onkeyup="filtrar(true)"></div>
        <div class="form-group" style="flex:1;">
            <label>Filas</label>
            <select id="rows-per-page" onchange="actualizarFilasPorPagina()">
                <option value="10" selected>10 filas</option>
                <option value="50">50 filas</option>
                <option value="100">100 filas</option>
            </select>
        </div>
    </div>

    <div class="paginacion-bar no-print">
        <div id="info-total" style="font-size: 11px; font-weight: bold; color: var(--social);"></div>
        <div>
            <button class="btn-pag" id="btn-prev" onclick="cambiarPagina(-1)">Anterior</button>
            <span id="page-info" style="margin: 0 10px; font-size: 11px;">Página 1</span>
            <button class="btn-pag" id="btn-get-next" onclick="cambiarPagina(1)">Siguiente</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Evidencia</th>
                    <th>Fecha</th>
                    <th>Nombre del Beneficiario</th>
                    <th>Col_Loc</th>
                    <th>Programa</th>
                    <th>Asunto</th>
                    <th>Estatus</th>
                    <th>Usuario</th>
                    <th class="no-print">Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<div id="modal-foto" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
    <span onclick="document.getElementById('modal-foto').style.display='none'" style="position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer; user-select:none;">&times;</span>
    <img id="img-modal" style="max-width:90%; max-height:85%; border-radius:8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCk6vNVA6mkYzcqdgSBE2akIMVkXYOwq0E",
        projectId: "poblacion-vulnerable---dif"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const apoyosRef = collection(db, "trabajo_social");

    let todosLosDatos = [];
    let datosFiltrados = [];
    let paginaActual = 1;
    let filasPorPagina = 10;
    let proximoNo = 1;

    const listaCampos = [
        'numero_consecutivo', 'fecha_registro', 'nombre', 'telefono', 
        'col_loc', 'direccion', 'programa', 'asunto', 'detalle_asunto',
        'horarios_mixtos', 'folio_expediente', 'estatus', 
        'detalles', 'usuario', 'observaciones', 'url_evidencia'
    ];

    function comprimirImagen(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    onSnapshot(apoyosRef, (snapshot) => {
        todosLosDatos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const numeros = todosLosDatos.map(d => parseInt(d.numero_consecutivo) || 0);
        proximoNo = (numeros.length > 0) ? Math.max(...numeros) + 1 : 1;
        
        if(!document.getElementById('edit-id').value) document.getElementById('numero_consecutivo').value = proximoNo;
        window.filtrar(false);
    });

// 1. COMPROBACIÓN TOTAL CONTRA TODAS LAS FECHAS REGISTRADAS
    window.verificarApoyoActivo = (nombreActual, idActual = null) => {
        if (!nombreActual) return null;
        const nombreLimpio = nombreActual.trim().toUpperCase();
        
        // Buscamos TODOS los registros que coincidan con este nombre (excluyendo el que se está editando)
        const coincidencias = todosLosDatos.filter(reg => 
            reg.id !== idActual && 
            reg.nombre && 
            reg.nombre.trim().toUpperCase() === nombreLimpio
        );

        if (coincidencias.length > 0) {
            // Ordenamos el historial de la fecha más reciente a la más antigua
            coincidencias.sort((a, b) => new Date(b.fecha_registro) - new Date(a.fecha_registro));
            return coincidencias;
        }

        return null; // Sin antecedentes
    };

    // 2. LANZAR ALERTA EN TIEMPO REAL CON EL HISTORIAL COMPLETO DE FECHAS
    window.revisarNombreDuplicado = async () => {
    const nombreInput = document.getElementById('nombre');
    if (!nombreInput) return;

    const nombreActual = nombreInput.value;
    const idActual = document.getElementById('edit-id').value || null;

    const historial = window.verificarApoyoActivo(nombreActual, idActual);

    if (historial) {
        // Construimos las filas de los antecedentes de forma dinámica
        let filasHtml = '';
        historial.forEach((reg, index) => {
            filasHtml += `
                <div style="text-align: left; background: #f8f9fa; border-left: 4px solid #dc3545; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 0.9rem;">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; color: #333;">
                        <span>📅 ${reg.fecha_registro || 'Sin fecha'}</span>
                        <span style="background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; color: #4a5568;">${reg.estatus || 'PENDIENTE'}</span>
                    </div>
                    <div style="color: #555; margin-left: 5px;">
                        <div><b>Programa:</b> ${reg.programa || 'NO ASIGNADO'}</div>
                        <div><b>Asunto:</b> ${reg.asunto || 'NO ASIGNADO'}</div>
                    </div>
                </div>
            `;
        });

        // Lanzamos la alerta estilizada
        Swal.fire({
            title: '⚠️ Antecedentes Detectados',
            html: `
                <div style="margin-bottom: 15px; font-size: 1rem; color: #333;">
                    El ciudadano <b style="color: #dc3545;">${nombreActual.toUpperCase()}</b> ya cuenta con <b>${historial.length}</b> registro(s) previo(s):
                </div>
                <div style="max-height: 280px; overflow-y: auto; padding-right: 5px;">
                    ${filasHtml}
                </div>
                <p style="margin-top: 15px; font-size: 0.85rem; color: #666; font-style: italic;">
                    Por favor, revisa si procede otorgar un nuevo apoyo basándote en la regla de temporalidad.
                </p>
            `,
            icon: 'warning',
            confirmButtonText: 'Entendido',
            confirmButtonColor: '#3085d6',
            width: '500px'
        });
    }
};

    // 3. ADAPTACIÓN DE BOTÓN GUARDAR CON REVISIÓN GLOBAL
    window.subirYGuardar = async () => {
        const data = obtenerValoresForm(); 
        
        const historial = window.verificarApoyoActivo(data.nombre);
        if (historial) {
            const mensaje = `⚠️ ATENCIÓN: El beneficiario "${data.nombre}" ya tiene ${historial.length} antecedente(s) en diferentes fechas.\n\n¿Estás seguro de que deseas saltarte la advertencia y GUARDAR este NUEVO registro de todos modos?`;
            if (!confirm(mensaje)) return;
        }

        const fileInput = document.getElementById('input_file');
        const file = fileInput.files[0];
        let base64Data = ""; 

        if (file) {
            document.getElementById('txt-compresion').style.display = 'inline-block';
            document.getElementById('txt-compresion').innerText = "⏳ Optimizando imagen...";
            base64Data = await comprimirImagen(file);
        }

        try {
            data.url_evidencia = base64Data;
            await addDoc(apoyosRef, data);
            alert("✅ Registro guardado con éxito.");
            limpiarForm();
        } catch (e) {
            alert("Error al guardar: " + e.message);
        }
    };

    // 4. ADAPTACIÓN DE BOTÓN ACTUALIZAR CON REVISIÓN GLOBAL
    window.actualizar = async () => {
        const id = document.getElementById('edit-id').value;
        const data = obtenerValoresForm();

        const historial = window.verificarApoyoActivo(data.nombre, id);
        if (historial) {
            const mensaje = `⚠️ ATENCIÓN: Estás modificando el nombre a "${data.nombre}", el cual ya cuenta con ${historial.length} registro(s) previo(s) en el sistema.\n\n¿Deseas continuar con la ACTUALIZACIÓN de todos modos?`;
            if (!confirm(mensaje)) return;
        }

        const fileInput = document.getElementById('input_file');
        const file = fileInput.files[0];
        const borrarFotoFlag = document.getElementById('eliminar-foto-flag').value === "true";

        try {
            if (file) {
                data.url_evidencia = await comprimirImagen(file);
            } else if (borrarFotoFlag) {
                data.url_evidencia = "";
            } else {
                const regOriginal = todosLosDatos.find(r => r.id === id);
                data.url_evidencia = (regOriginal && regOriginal.url_evidencia) ? regOriginal.url_evidencia : "";
            }
            
            await updateDoc(doc(db, "trabajo_social", id), data);
            alert("✅ Registro actualizado correctamente.");
            limpiarForm();
        } catch (e) { 
            alert("Error al actualizar: " + e.message); 
        }
    };
    
    window.editarLocal = (id) => {
        const reg = todosLosDatos.find(r => r.id === id);
        if(!reg) return;
        document.getElementById('edit-id').value = id;
        document.getElementById('eliminar-foto-flag').value = "false";
        
        listaCampos.forEach(c => {
            const el = document.getElementById(c);
            if(el) el.value = reg[c] || "";
        });

        window.actualizarAsuntos();
        document.getElementById('asunto').value = reg.asunto || "";
        
        window.actualizarEspecificaciones();
        
        if(reg.detalle_asunto) {
            const detalleSelect = document.getElementById('detalle_asunto');
            if (detalleSelect) detalleSelect.value = reg.detalle_asunto;
        }

        const btnDeletePhoto = document.getElementById('btn-delete-photo');
        if(reg.url_evidencia && reg.url_evidencia !== "") {
            btnDeletePhoto.style.display = 'flex';
        } else {
            btnDeletePhoto.style.display = 'none';
        }

        document.getElementById('btn-save').style.display = 'none';
        document.getElementById('btn-update').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.quitarFotoForm = () => {
        if(confirm("¿Seguro que deseas quitar la foto de este registro? Para confirmar el cambio deberás dar clic en ACTUALIZAR.")) {
            document.getElementById('eliminar-foto-flag').value = "true";
            document.getElementById('btn-delete-photo').style.display = 'none';
            document.getElementById('input_file').value = "";
            
            const txtComp = document.getElementById('txt-compresion');
            txtComp.style.display = 'inline-block';
            txtComp.innerText = "🗑️ Foto marcada para eliminación.";
            txtComp.style.color = "var(--danger)";
        }
    };

    function obtenerValoresForm() {
        const res = {};
        listaCampos.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                if(['numero_consecutivo', 'fecha_registro', 'usuario', 'detalle_asunto'].includes(id)) {
                    res[id] = el.value;
                } else {
                    res[id] = el.value.toUpperCase();
                }
            }
        });
        return res;
    }

    window.limpiarForm = () => {
        listaCampos.forEach(id => {
            const el = document.getElementById(id);
            if(el && id !== "numero_consecutivo") el.value = "";
        });
        if(document.getElementById('input_file')) document.getElementById('input_file').value = "";
        
        const txtComp = document.getElementById('txt-compresion');
        txtComp.style.display = 'none';
        txtComp.style.color = "var(--success)";
        
        document.getElementById('eliminar-foto-flag').value = "false";
        document.getElementById('btn-delete-photo').style.display = 'none';
        document.getElementById('numero_consecutivo').value = proximoNo;
        document.getElementById('edit-id').value = "";
        document.getElementById('btn-save').style.display = 'inline-block';
        document.getElementById('btn-update').style.display = 'none';
        document.getElementById('container-detalle-especifico').style.display = 'none';
        
        establecerUsuarioPorDefecto();
    };

    window.actualizarAsuntos = () => {
        const prog = document.getElementById('programa').value;
        const asuSelect = document.getElementById('asunto');
        const contDet = document.getElementById('container-detalle-especifico');
        
        asuSelect.innerHTML = '<option value="">-- SELECCIONAR --</option>';
        contDet.style.display = 'none';

        const dataAsuntos = {
            "SOLICITUD": ["APOYOS FUNCIONALES", "GESTION DE CITAS"],
            "VISITA DOMICILIARIA": ["INVESTIGACION", "CERCIORAMIENTO DE TUTOR", "ASILO"],
            "ATENCION CIUDADANA": ["ENTREGA DE APOYOS FUNCIONALES ESTATALES", "ENTREGA DE APOYOS FUNCIONALES MUNICIPALES", "TRASLADO Y ACOMPAÑAMIENTO A CRISVER", "PLATICAS PREVENTIVAS"],
            "ESTUDIO SOCIOECONOMICO": ["ASILO", "DESCUENTO TRANSPORTE", "DESCUENTO CMAPS", "APOYO ATAUD", "APOYO FUNCIONAL", "ESTUDIOS CLINICOS", "TRASLADO DE CUERPO", "REGISTRO CIVIL", "TERAPIAS CRISAT", "APOYO AL INMIGRANTE"],
            "V.D./E. SOCIOECONOMICO": ["ASILO", "ADOPCIÓN"]
        };

        if(dataAsuntos[prog]) {
            dataAsuntos[prog].forEach(a => {
                const opt = document.createElement('option');
                opt.value = a; opt.textContent = a;
                asuSelect.appendChild(opt);
            });
        }
    };

    window.actualizarEspecificaciones = () => {
        const asuSelect = document.getElementById('asunto');
        const detSelect = document.getElementById('detalle_asunto');
        const contDet = document.getElementById('container-detalle-especifico');
        const asu = asuSelect.value;

        const dataAsuntos = {
            "SOLICITUD": ["APOYOS FUNCIONALES", "GESTION DE CITAS"],
            "VISITA DOMICILIARIA": ["INVESTIGACION", "CERCIORAMIENTO DE TUTOR", "ASILO"],
            "ATENCION CIUDADANA": ["ENTREGA DE APOYOS FUNCIONALES ESTATALES", "ENTREGA DE APOYOS FUNCIONALES MUNICIPALES", "TRASLADO Y ACOMPAÑAMIENTO A CRISVER", "PLATICAS PREVENTIVAS"],
            "ESTUDIO SOCIOECONOMICO": ["ASILO", "DESCUENTO TRANSPORTE", "DESCUENTO CMAPS", "APOYO ATAUD", "APOYO FUNCIONAL", "ESTUDIOS CLINICOS", "TRASLADO DE CUERPO", "REGISTRO CIVIL", "TERAPIAS CRISAT", "APOYO AL INMIGRANTE", "CONDONACIÓN DE LENTES"],
            "V.D./E. SOCIOECONOMICO": ["ASILO", "ADOPCIÓN"]
        };

        if(subData[asu]) {
            detSelect.innerHTML = '<option value="">-- SELECCIONAR ESPECIFICACIÓN --</option>';
            subData[asu].forEach(s => {
                const o = document.createElement('option');
                o.value = s; o.textContent = s;
                detSelect.appendChild(o);
            });
            contDet.style.display = 'block';
            document.getElementById('label-detalle').innerText = (asu.includes("APOYO")) ? "Tipo de Apoyo" : "Diagnóstico";
        } else {
            contDet.style.display = 'none';
        }
    };

    window.abrirFoto = (url) => {
        const modal = document.getElementById('modal-foto');
        const img = document.getElementById('img-modal');
        img.src = url;
        modal.style.display = 'flex';
    };

    window.filtrar = (resetearPagina = false) => {
        if(resetearPagina) paginaActual = 1;
        const term = document.getElementById('buscador').value.toLowerCase();
        datosFiltrados = todosLosDatos.filter(r => 
            Object.values(r).some(v => String(v).toLowerCase().includes(term))
        ).sort((a,b) => (parseInt(b.numero_consecutivo)||0) - (parseInt(a.numero_consecutivo)||0));
        renderTabla();
    };

    function renderTabla() {
    const totalPaginas = Math.ceil(datosFiltrados.length / filasPorPagina) || 1;
    if(paginaActual > totalPaginas) paginaActual = totalPaginas;

    const inicio = (paginaActual - 1) * filasPorPagina;
    const segmento = datosFiltrados.slice(inicio, inicio + filasPorPagina);
    const tbody = document.getElementById('cuerpoTabla');
    document.getElementById('info-total').innerText = `TOTAL: ${datosFiltrados.length} REGISTROS`;
    
    tbody.innerHTML = segmento.map(reg => `
        <tr>
            <td><b>${reg.numero_consecutivo}</b></td>
            <td>
                ${reg.url_evidencia ? `
                    <img src="${reg.url_evidencia}" 
                         onclick="abrirFoto('${reg.url_evidencia}')" 
                         alt="Evidencia" 
                         style="max-width: 60px; max-height: 45px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #cbd5e1;"
                         title="Clic para ampliar" />
                ` : '<span style="color:#cbd5e1; font-size:9px;">Sin foto</span>'}
            </td>
            <td>${reg.fecha_registro || ''}</td>
            <td><b>${reg.nombre}</b></td>
            <td>${reg.col_loc || ''}</td>
            <td style="font-size:9px;">${reg.programa || ''}</td>
            <td>${reg.asunto || ''} ${reg.detalle_asunto ? `<br><small style="color:blue">${reg.detalle_asunto}</small>` : ''}</td>
            <td><span class="status-badge bg-${reg.estatus?.toLowerCase().replace(" ","-") || 'pendiente'}">${reg.estatus || 'PENDIENTE'}</span></td>
            <td>${reg.usuario || ''}</td>
            <td class="no-print">
                <button onclick="editarLocal('${reg.id}')" style="border:none; background:none; cursor:pointer;">✏️</button>
                <button onclick="eliminarDoc('${reg.id}')" style="border:none; background:none; cursor:pointer;">🗑️</button>
            </td>
        </tr>
    `).join('');

        document.getElementById('page-info').innerText = `Página ${paginaActual} de ${totalPaginas}`;
        document.getElementById('btn-prev').disabled = paginaActual === 1;
        document.getElementById('btn-get-next').disabled = paginaActual === totalPaginas;
    }

    window.eliminarDoc = async (id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, "trabajo_social", id)); };
    
    window.exportarExcel = () => {
        const ws = XLSX.utils.json_to_sheet(datosFiltrados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, "Reporte_Trabajo_Social.xlsx");
    };
    
    window.cambiarPagina = (d) => { 
        paginaActual += d; 
        renderTabla(); 
    };
    
    window.actualizarFilasPorPagina = () => { 
        filasPorPagina = parseInt(document.getElementById('rows-per-page').value); 
        paginaActual = 1; 
        renderTabla(); 
    };

    function establecerUsuarioPorDefecto() {
        const nombreSocial = sessionStorage.getItem('social_nombre');
        const selectUsuario = document.getElementById('usuario');
        if (nombreSocial && selectUsuario) {
            for (let i = 0; i < selectUsuario.options.length; i++) {
                if (selectUsuario.options[i].value === nombreSocial) {
                    selectUsuario.selectedIndex = i;
                    break;
                }
            }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const nombreSocial = sessionStorage.getItem('social_nombre');
        const tituloSocial = sessionStorage.getItem('social_titulo');
        const saludoContenedor = document.getElementById('bienvenida-usuario');

        const asuntoSelect = document.getElementById('asunto');
        if (asuntoSelect) {
            asuntoSelect.addEventListener('change', window.actualizarEspecificaciones);
        }

        const nombreInput = document.getElementById('nombre');
        if (nombreInput) {
            nombreInput.addEventListener('blur', window.revisarNombreDuplicado);
        }

        if (nombreSocial && tituloSocial) {
            saludoContenedor.innerText = `¡BIENVENIDA, ${tituloSocial} ${nombreSocial}!`;
            saludoContenedor.style.display = 'inline-block';
        }
        establecerUsuarioPorDefecto();
    });

    window.cerrarSesion = () => {
        if (confirm("¿Está seguro de que desea cerrar sesión?")) {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    };
</script>
</body>
</html>
