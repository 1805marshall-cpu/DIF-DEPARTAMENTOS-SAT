<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF 2026 | Trabajo Social</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #1e40af; --success: #059669; --warning: #f59e0b; 
            --danger: #dc2626; --bg: #f8fafc; --social: #1e40af; --excel: #1d6f42;
        }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: #1e293b; font-size: 13px; }
        header { background: #fff; padding: 15px 40px; border-bottom: 3px solid var(--social); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .container { max-width: 1850px; margin: 20px auto; padding: 0 20px; }
        
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        h3 { margin: 0 0 15px 0; font-size: 11px; color: var(--social); text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; letter-spacing: 1px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 3px; }
        input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--social); box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.1); }
        
        .btn-box { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .search-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; gap: 15px; align-items: flex-end; }
        
        .table-wrap { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1500px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 10px; color: #475569; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover { background-color: #fcfcfc; }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .bg-entregado { background: #dcfce7; color: #15803d; }
        .bg-pendiente { background: #fef3c7; color: #b45309; }
        .bg-realizado { background: #e0f2fe; color: #0369a1; }

        .modal-foto { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { max-width: 85%; max-height: 85%; border: 4px solid white; border-radius: 10px; }

        .paginacion-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .btn-pag { padding: 6px 12px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer; font-size: 11px; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print">
    <div style="display: flex; align-items: center; gap: 20px;">
        <h2 style="margin:0; color: var(--social); font-size: 18px;"><i class="fas fa-users-cog"></i> TRABAJO SOCIAL DIF</h2>
        <button class="btn" style="background: var(--primary)" onclick="location.href='admin_global.html'"><i class="fa-solid fa-house"></i> DASHBOARD</button>
    </div>
</header>

<div class="container">
    <div class="card no-print">
        <h3><i class="fas fa-folder-plus"></i> Registro de Casos y Apoyos</h3>
        <input type="hidden" id="edit-id">
        <div class="form-grid">
            <div class="form-group"><label>Folio</label><input type="text" id="numero_consecutivo" readonly style="background:#f1f5f9; font-weight:bold;"></div>
            <div class="form-group"><label>Fecha</label><input type="date" id="fecha_registro"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Nombre del Beneficiario</label><input type="text" id="nombre"></div>
            <div class="form-group"><label>Teléfono</label><input type="tel" id="telefono"></div>
            <div class="form-group"><label>Localidad</label><input type="text" id="col_loc"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Dirección Específica</label><input type="text" id="direccion"></div>
            <div class="form-group">
                <label>Programa</label>
                <select id="programa">
                    <option value="">-- SELECCIONAR --</option>
                    <option value="APOYO">APOYO</option>
                    <option value="ASILO">ASILO</option>
                    <option value="ATENCIÓN CIUDADANA">ATENCIÓN CIUDADANA</option>
                    <option value="CAMPAÑA">CAMPAÑA</option>
                    <option value="DESCUENTO">DESCUENTO</option>
                    <option value="GESTION DE CITAS">GESTION DE CITAS</option>
                    <option value="INVESTIGACION DE CAMPO">INVESTIGACION DE CAMPO</option>
                    <option value="ESTUDIO SOCIO ECONÓMICO">ESTUDIO SOCIO ECONÓMICO</option>
                    <option value="VISITA DOMICILIARIA">VISITA DOMICILIARIA</option>
                    <option value="SOLICITUD">SOLICITUD</option>
                </select>
            </div>
            <div class="form-group"><label>Asunto</label><input type="text" id="asunto"></div>
            <div class="form-group"><label>H. Mixto</label><select id="horarios_mixtos"><option value="NO">NO</option><option value="SI">SI</option></select></div>
            <div class="form-group"><label>Folio Exp.</label><input type="text" id="folio_expediente"></div>
            <div class="form-group">
                <label>Estatus</label>
                <select id="estatus">
                    <option value="PENDIENTE">PENDIENTE</option>
                    <option value="ENTREGADO">ENTREGADO</option>
                    <option value="REALIZADO">REALIZADO</option>
                </select>
            </div>
            <div class="form-group"><label>Registró</label><input type="text" id="usuario"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Observaciones</label><input type="text" id="observaciones"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Adjuntos (INE/Receta)</label><input type="file" id="ine_file" accept="image/*" multiple></div>
        </div>

        <div class="btn-box">
            <button class="btn" id="btn-save" style="background:var(--success)" onclick="guardar()"><i class="fas fa-save"></i> GUARDAR</button>
            <button class="btn" id="btn-update" style="background:var(--warning); display:none;" onclick="actualizar()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
            <button class="btn" style="background:var(--excel)" onclick="exportarExcel()"><i class="fas fa-file-excel"></i> EXPORTAR</button>
            <label class="btn" style="background:#6366f1; cursor:pointer;">
                <i class="fas fa-upload"></i> IMPORTAR EXCEL
                <input type="file" id="import-excel" accept=".xlsx, .xls" style="display:none" onchange="importarDesdeExcel(event)">
            </label>
            <button class="btn" style="background:var(--danger)" onclick="eliminarTodoBaseDatos()"><i class="fas fa-trash-alt"></i> BORRAR TODO</button>
            <button class="btn" style="background:#94a3b8" onclick="limpiarForm()"><i class="fas fa-eraser"></i> LIMPIAR</button>
        </div>
    </div>

    <div class="search-box no-print">
        <div class="form-group" style="flex:2;">
            <label>🔍 Buscador de Beneficiarios</label>
            <input type="text" id="buscador" placeholder="Buscar por nombre, localidad, programa..." onkeyup="filtrar()">
        </div>
        <div class="form-group" style="flex:1;">
            <label>Mostrar</label>
            <select id="rows-per-page" onchange="actualizarFilasPorPagina()">
                <option value="10" selected>10 filas</option>
                <option value="50">50 filas</option>
            </select>
        </div>
    </div>

    <div class="paginacion-bar no-print">
        <div id="info-total" style="font-size: 11px; font-weight: bold; color: var(--social);"></div>
        <div>
            <button class="btn-pag" onclick="cambiarPagina(-1)">Anterior</button>
            <span id="page-info" style="margin: 0 10px; font-size: 11px;">Página 1</span>
            <button class="btn-pag" onclick="cambiarPagina(1)">Siguiente</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Doc</th>
                    <th>Folio</th>
                    <th>Fecha</th>
                    <th>Beneficiario</th>
                    <th>Localidad</th>
                    <th>Programa</th>
                    <th>Asunto</th>
                    <th>Exp.</th>
                    <th>Estatus</th>
                    <th>Registró</th>
                    <th class="no-print">Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<div id="modalFoto" class="modal-foto" onclick="cerrarModal()"><img id="imgGrande" class="modal-content"></div>

<script type="module">
    // MANTIENE TODA TU LÓGICA ORIGINAL DE FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCk6vNVA6mkYzcqdgSBE2akIMVkXYOwq0E",
        projectId: "poblacion-vulnerable---dif"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const apoyosRef = collection(db, "trabajo_social");

    let todosLosDatos = [];
    let datosFiltrados = [];
    let paginaActual = 1;
    let filasPorPagina = 10;
    let proximoNo = 1;

    onSnapshot(apoyosRef, (snapshot) => {
        todosLosDatos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const numeros = todosLosDatos.map(d => parseInt(d.numero_consecutivo) || 0);
        proximoNo = (numeros.length > 0) ? Math.max(...numeros) + 1 : 1;
        if(!document.getElementById('edit-id').value) document.getElementById('numero_consecutivo').value = proximoNo;
        window.filtrar();
    });

    window.guardar = async () => {
        const data = obtenerValoresForm();
        if(!data.nombre) return alert("Nombre requerido");
        data.imagenes = await procesarImagenes(document.getElementById('ine_file').files);
        await addDoc(apoyosRef, data);
        limpiarForm();
    };

    window.actualizar = async () => {
        const id = document.getElementById('edit-id').value;
        const data = obtenerValoresForm();
        const files = document.getElementById('ine_file').files;
        if(files.length > 0) data.imagenes = await procesarImagenes(files);
        await updateDoc(doc(db, "trabajo_social", id), data);
        limpiarForm();
        alert("✅ Registro actualizado.");
    };

    window.filtrar = () => {
        const term = document.getElementById('buscador').value.toLowerCase();
        datosFiltrados = todosLosDatos.filter(r => 
            Object.values(r).some(v => String(v).toLowerCase().includes(term))
        ).sort((a,b) => a.numero_consecutivo - b.numero_consecutivo);
        renderTabla();
    };

    function renderTabla() {
        const inicio = (paginaActual - 1) * filasPorPagina;
        const segmento = datosFiltrados.slice(inicio, inicio + filasPorPagina);
        const tbody = document.getElementById('cuerpoTabla');
        
        document.getElementById('info-total').innerText = `REGISTROS ENCONTRADOS: ${datosFiltrados.length}`;
        
        tbody.innerHTML = segmento.map(reg => `
            <tr>
                <td>${reg.imagenes?.length ? `<i class="fas fa-image" style="color:var(--social); cursor:pointer" onclick="verImagen('${reg.imagenes[0]}')"></i>` : '-'}</td>
                <td><b>${reg.numero_consecutivo}</b></td>
                <td>${reg.fecha_registro}</td>
                <td><b>${reg.nombre}</b></td>
                <td>${reg.col_loc}</td>
                <td><span style="font-size:10px; font-weight:bold; color:#64748b;">${reg.programa}</span></td>
                <td>${reg.asunto || ''}</td>
                <td>${reg.folio_expediente || ''}</td>
                <td><span class="status-badge ${getEstatusClass(reg.estatus)}">${reg.estatus || 'PENDIENTE'}</span></td>
                <td>${reg.usuario || ''}</td>
                <td class="no-print">
                    <button onclick="editarLocal('${reg.id}')" style="border:none; background:none; cursor:pointer;">✏️</button>
                    <button onclick="eliminarDoc('${reg.id}')" style="border:none; background:none; cursor:pointer;">🗑️</button>
                </td>
            </tr>
        `).join('');
        
        const totalPags = Math.ceil(datosFiltrados.length / filasPorPagina) || 1;
        document.getElementById('page-info').innerText = `Página ${paginaActual} de ${totalPags}`;
    }

    function getEstatusClass(estatus) {
        if(estatus === 'ENTREGADO') return 'bg-entregado';
        if(estatus === 'REALIZADO') return 'bg-realizado';
        return 'bg-pendiente';
    }

    // Funciones de apoyo (Importar, Exportar, Procesar Imágenes) se mantienen igual a tu código original...
    window.importarDesdeExcel = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            let count = 0;
            for (const f of json) {
                // ... (tu lógica de mapeo de Excel se mantiene intacta)
            }
            alert(`✅ ${count} Registros importados.`);
        };
        reader.readAsArrayBuffer(file);
    };

window.exportarExcel = () => {
    // 1. Ordenamos numéricamente por Folio para que el Excel sea profesional
    const datosOrdenados = [...datosFiltrados].sort((a, b) => {
        return (parseInt(a.numero_consecutivo) || 0) - (parseInt(b.numero_consecutivo) || 0);
    });

    // 2. Mapeo con los nombres de columna EXACTOS de social.html
    const datosMapeados = datosOrdenados.map(r => ({
        "No": r.numero_consecutivo || "",
        "Fecha": r.fecha_registro || "",
        "Nombre del Beneficiario": r.nombre || "",
        "Localidad / Colonia": r.col_loc || "",
        "Dirección": r.direccion || "",
        "Teléfono": r.telefono || "",
        "Programa": r.programa || "",
        "Asunto / Solicitud": r.asunto || "",
        "Folio Exp.": r.folio_expediente || "",
        "Estatus": r.estatus || "PENDIENTE",
        "Observaciones": r.observaciones || "",
        "Registró": r.usuario || ""
    }));

    // 3. Crear la hoja de cálculo
    const ws = XLSX.utils.json_to_sheet(datosMapeados);

    // 4. Configurar anchos de columna para una lectura clara
    const wscols = [
        { wch: 6 },  // No
        { wch: 12 }, // Fecha
        { wch: 35 }, // Nombre
        { wch: 25 }, // Localidad
        { wch: 30 }, // Dirección
        { wch: 15 }, // Teléfono
        { wch: 20 }, // Programa
        { wch: 25 }, // Asunto
        { wch: 10 }, // Folio Exp
        { wch: 15 }, // Estatus
        { wch: 45 }, // Observaciones
        { wch: 20 }  // Registró
    ];
    ws['!cols'] = wscols;

    // 5. Generar el libro y descargar
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Padron_Trabajo_Social");
    
    // Nombre del archivo con la fecha del sistema 2026
    const hoy = new Date().toISOString().split('T')[0];
    XLSX.writeFile(wb, `Reporte_Trabajo_Social_DIF_${hoy}.xlsx`);
};

    window.eliminarTodoBaseDatos = async () => {
        if(confirm("¿BORRAR TODO?") && prompt("Escribe ELIMINAR") === "ELIMINAR") {
            const snap = await getDocs(apoyosRef);
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
        }
    };

    window.eliminarDoc = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "trabajo_social", id)); };

    window.editarLocal = (id) => {
        const reg = todosLosDatos.find(r => r.id === id);
        document.getElementById('edit-id').value = id;
        Object.keys(reg).forEach(key => { if(document.getElementById(key)) document.getElementById(key).value = reg[key]; });
        document.getElementById('btn-save').style.display = 'none';
        document.getElementById('btn-update').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function obtenerValoresForm() {
        const res = {};
        ['numero_consecutivo','fecha_registro','nombre','telefono','col_loc','direccion','programa','asunto','horarios_mixtos','folio_expediente','estatus','usuario','observaciones'].forEach(id => {
            const el = document.getElementById(id);
            if(el) res[id] = el.value.toUpperCase();
        });
        return res;
    }

    window.limpiarForm = () => {
        document.querySelectorAll('input, select').forEach(el => el.value = "");
        document.getElementById('numero_consecutivo').value = proximoNo;
        document.getElementById('edit-id').value = "";
        document.getElementById('btn-save').style.display = 'inline-block';
        document.getElementById('btn-update').style.display = 'none';
    };

    window.cambiarPagina = (dir) => {
        const max = Math.ceil(datosFiltrados.length / filasPorPagina);
        if(paginaActual + dir > 0 && paginaActual + dir <= max) { paginaActual += dir; renderTabla(); }
    };

    window.actualizarFilasPorPagina = () => {
        filasPorPagina = parseInt(document.getElementById('rows-per-page').value);
        paginaActual = 1;
        renderTabla();
    };

    async function procesarImagenes(files) {
        return await Promise.all(Array.from(files).map(f => new Promise(r => {
            const reader = new FileReader();
            reader.onload = e => r(e.target.result);
            reader.readAsDataURL(f);
        })));
    }

    window.verImagen = (s) => { document.getElementById('imgGrande').src = s; document.getElementById('modalFoto').style.display = 'flex'; };
    window.cerrarModal = () => document.getElementById('modalFoto').style.display = 'none';
</script>
</body>
</html>
