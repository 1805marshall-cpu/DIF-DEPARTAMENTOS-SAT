<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF 2026 | Trabajo Social</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #1e40af; --success: #059669; --warning: #f59e0b; 
            --danger: #dc2626; --bg: #f8fafc; --social: #1e40af; --excel: #1d6f42;
        }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: #1e293b; font-size: 13px; }
        header { background: #fff; padding: 15px 40px; border-bottom: 3px solid var(--social); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .container { max-width: 1850px; margin: 20px auto; padding: 0 20px; }
        
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; margin-bottom: 20px; }
        h3 { margin: 0 0 15px 0; font-size: 11px; color: var(--social); text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; letter-spacing: 1px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 3px; }
        input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--social); box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.1); }
        
        .btn-box { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .search-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; display: flex; gap: 15px; align-items: flex-end; }
        
        .table-wrap { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1700px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 10px; color: #475569; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover { background-color: #fcfcfc; }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .bg-atendido { background: #dcfce7; color: #15803d; }
        .bg-realizado { background: #dcfce7; color: #15803d; }
        .bg-validado { background: #dcfce7; color: #7dbe95; }
        .bg-entregado { background: #e0f2fe; color: #0369a1; }
        .bg-pendiente { background: #ff9849; color: #b45309; }
        .bg-cancelado { background: #f77979; color: #b40909; }
        .bg-en proceso { background: #e0f2fe; color: #54859f; }
       


        .paginacion-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .btn-pag { padding: 6px 12px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer; font-size: 11px; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print">
    <div style="display: flex; align-items: center; gap: 20px;">
        <h2 style="margin:0; color: var(--social); font-size: 18px;"><i class="fas fa-users-cog"></i> TRABAJO SOCIAL DIF</h2>
        <button class="btn" style="background: var(--primary)" onclick="location.href='admin_global.html'"><i class="fa-solid fa-house"></i> DASHBOARD</button>
    </div>
</header>

<div class="container">
    <div class="card no-print">
    <h3 style="margin-bottom: 25px; color: var(--primary); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">
        <i class="fas fa-folder-plus"></i> Registro de Casos y Apoyos
    </h3>
    <input type="hidden" id="edit-id">
    
    <div class="form-grid" style="display: flex; flex-direction: column; gap: 20px;">
        
        <!-- SECCIÓN 1: IDENTIFICACIÓN Y DATOS PERSONALES -->
        <fieldset style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background-color: #ffffff;">
            <legend style="padding: 0 15px; font-weight: 800; color: var(--primary); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">
                <i class="fas fa-user-circle"></i> Datos del Beneficiario
            </legend>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                <div class="form-group"><label>No. Consecutivo</label><input type="text" id="numero_consecutivo" readonly style="background:#f8fafc; font-weight:bold;"></div>
                <div class="form-group"><label>Fecha de Registro</label><input type="date" id="fecha_registro"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Nombre del Beneficiario</label><input type="text" id="nombre" placeholder="Nombre completo"></div>
                
                <div class="form-group"><label>Teléfono</label><input type="tel" id="telefono" placeholder="294..."></div>
                <div class="form-group"><label>Colonia/Localidad</label><input type="text" id="col_loc"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Dirección Exacta</label><input type="text" id="direccion"></div>
            </div>
        </fieldset>

        <!-- SECCIÓN 2: CLASIFICACIÓN DEL SERVICIO -->
        <fieldset style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background-color: #f8fafc;">
            <legend style="padding: 0 15px; font-weight: 800; color: var(--med-color); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">
                <i class="fas fa-hand-holding-heart"></i> Detalles del Trámite o Apoyo
            </legend>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div class="form-group">
                    <label>Programa</label>
                    <select id="programa">
                        <option value="">-- SELECCIONAR --</option>
                        <option value="SOLICITUD">SOLICITUD</option>
                        <option value="INVESTIGACION DE CAMPO">INVESTIGACIÓN DE CAMPO</option>
                        <option value="VISITA DOMICILIARIA">VISITA DOMICILIARIA</option>
                        <option value="ATENCION CIUDADANA">ATENCION CIUDADANA</option>
                        <option value="GESTION DE CITAS">GESTION DE CITAS</option>
                        <option value="ESTUDIO SOCIOECONOMICO">ESTUDIO SOCIOECONOMICO</option>
                        <option value="TRASLADOS">TRASLADOS</option>
                        <option value="CAMPAÑA ITINERANTE">CAMPAÑA ITINERANTE</option>
                        <option value="PLATICA PREVENTIVA">PLATICA PREVENTIVA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Asunto</label>
                    <select id="asunto">
                        <option value="">-- SELECCIONAR --</option>
                        <option value="ASILO">ASILO</option>
                        <option value="DESCUENTO TRANSPORTE"> DESCUENTO TRANSPORTE</option>
                        <option value="DESCUENTO CMAPS">DESCUENTO CMAPS</option>
                        <option value="APOYO ATAUD"> APOYO ATAUD</option>
                        <option value="REGISTRO CIVIL">REGISTRO CIVIL</option>
                        <option value="ESTUDIOS CLINICOS">ESTUDIOS CLINICOS</option>
                        <option value="CERCIORAMIENTO DE TUTOR">CERCIORAMIENTO DE TUTOR</option>
                        <option value="APOYO FUNCIONAL">APOYO FUNCIONAL</option>
                        <option value="PROTESIS">PROTESIS</option>
                        <option value="AUXILIAR AUDITIVO">AUXILIAR AUDITIVO</option>
                        <option value="DIVERSOS">DIVERSOS</option>
                        <option value="REINTREGACION DE MENOR">REINTREGACION DE MENOR</option>
                        <option value="TRASLADO DE CUERPO">TRASLADO DE CUERPO</option>
                        <option value="TERAPIAS CRISAT">TERAPIAS CRISAT</option>
                        <option value="CRISVER">CRISVER</option>
                        <option value="AUTISMO">AUTISMO</option>
                    </select>
                </div>
                <div class="form-group"><label>Folio Expediente</label><input type="text" id="folio_expediente" placeholder="Opcional"></div>
                <div class="form-group" style="grid-column: span 3;"><label>Detalles Específicos</label><input type="text" id="detalles" placeholder="Descripción breve del caso"></div>
            </div>
        </fieldset>

        <!-- SECCIÓN 3: CONTROL ADMINISTRATIVO -->
        <fieldset style="border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; background-color: #ffffff;">
            <legend style="padding: 0 15px; font-weight: 800; color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">
                <i class="fas fa-clipboard-check"></i> Estatus y Seguimiento
            </legend>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div class="form-group">
                    <label>Estatus</label>
                    <select id="estatus" style="background: #fffbeb; font-weight: bold;">
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="ATENDIDO">ATENDIDO</option>
                        <option value="ENTREGADO">ENTREGADO</option>
                        <option value="REALIZADO">REALIZADO</option>
                        <option value="CANCELADO">CANCELADO</option>
                        <option value="EN PROCESO">EN PROCESO</option>
                        <option value="VALIDADO">VALIDADO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>H. Mixtos</label>
                    <select id="horarios_mixtos"><option value="NO">NO</option><option value="SI">SI</option></select>
                </div>
                <div class="form-group">
                    <label>Usuario que Atiende</label>
                    <select id="usuario">
                        <option value="">-- SELECCIONAR --</option>
                        <option value="JUANITA C. CAMPECHANO QUEZADA">JUANITA C. CAMPECHANO QUEZADA</option>
                        <option value="MONSERRAT PLATA FLORES">MONSERRAT PLATA FLORES</option>
                        <option value="J.C.C.Q. / M.P.F.">J.C.C.Q. / M.P.F.</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 3;"><label>Observaciones del Trabajador Social</label><input type="text" id="observaciones"></div>
            </div>
        </fieldset>
    </div>

    <!-- BOTONERA -->
    <div class="btn-box" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #f1f5f9;">
        <button class="btn" id="btn-save" style="background:var(--success)" onclick="guardar()"><i class="fas fa-save"></i> GUARDAR</button>
        <button class="btn" id="btn-update" style="background:var(--warning); display:none;" onclick="actualizar()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
        <button class="btn" style="background:var(--excel)" onclick="exportarExcel()"><i class="fas fa-file-excel"></i> EXPORTAR</button>
        <button class="btn" style="background:#94a3b8" onclick="limpiarForm()"><i class="fas fa-eraser"></i> LIMPIAR</button>
    </div>
</div>

    <div class="search-box no-print">
        <div class="form-group" style="flex:2;">
            <label>🔍 Buscador Global</label>
            <input type="text" id="buscador" placeholder="Buscar por nombre, localidad, asunto..." onkeyup="filtrar()">
        </div>
        <div class="form-group" style="flex:1;">
            <label>Filas</label>
            <select id="rows-per-page" onchange="actualizarFilasPorPagina()">
                <option value="10" selected>10 filas</option>
                <option value="50">50 filas</option>
                <option value="100">100 filas</option>
            </select>
        </div>
    </div>

    <div class="paginacion-bar no-print">
        <div id="info-total" style="font-size: 11px; font-weight: bold; color: var(--social);"></div>
        <div>
            <button class="btn-pag" onclick="cambiarPagina(-1)">Anterior</button>
            <span id="page-info" style="margin: 0 10px; font-size: 11px;">Página 1</span>
            <button class="btn-pag" onclick="cambiarPagina(1)">Siguiente</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Fecha</th>
                    <th>Nombre del Beneficiario</th>
                    <th>Col_Loc</th>
                    <th>Programa</th>
                    <th>Asunto</th>
                    <th>Folio_Exp</th>
                    <th>Estatus</th>
                    <th>Usuario</th>
                    <th class="no-print">Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCk6vNVA6mkYzcqdgSBE2akIMVkXYOwq0E",
        projectId: "poblacion-vulnerable---dif"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const apoyosRef = collection(db, "trabajo_social");

    let todosLosDatos = [];
    let datosFiltrados = [];
    let paginaActual = 1;
    let filasPorPagina = 10;
    let proximoNo = 1;

    const listaCampos = [
        'numero_consecutivo', 'fecha_registro', 'nombre', 'telefono', 
        'col_loc', 'direccion', 'programa', 'asunto', 
        'horarios_mixtos', 'folio_expediente', 'estatus', 
        'detalles', 'usuario', 'observaciones'
    ];

    onSnapshot(apoyosRef, (snapshot) => {
        todosLosDatos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        const numeros = todosLosDatos.map(d => parseInt(d.numero_consecutivo) || 0);
        proximoNo = (numeros.length > 0) ? Math.max(...numeros) + 1 : 1;
        if(!document.getElementById('edit-id').value) document.getElementById('numero_consecutivo').value = proximoNo;
        window.filtrar();
    });

    window.guardar = async () => {
    const data = obtenerValoresForm();
    if(!data.nombre) return alert("El nombre del beneficiario es obligatorio.");

    // VALIDACIÓN DE DUPLICADOS
    // Buscamos si el nombre ya existe en los registros actuales
    const registroPrevio = todosLosDatos.find(r => 
        r.nombre.trim().toUpperCase() === data.nombre.trim().toUpperCase()
    );

    if (registroPrevio) {
        const mensaje = `⚠️ ATENCIÓN: El beneficiario "${registroPrevio.nombre}" ya se encuentra registrado.\n\n` +
                        `• Programa previo: ${registroPrevio.programa || 'No especificado'}\n` +
                        `• Asunto registrado: ${registroPrevio.asunto || 'Sin asunto'}\n` +
                        `• Fecha: ${registroPrevio.fecha_registro || 'Sin fecha'}\n\n` +
                        `¿Deseas registrar este nuevo caso de todos modos?`;
        
        if (!confirm(mensaje)) return; // Si el usuario cancela, no se guarda nada
    }

    try {
        await addDoc(apoyosRef, data);
        alert("✅ Registro guardado con éxito.");
        limpiarForm();
    } catch (error) {
        console.error("Error al guardar:", error);
        alert("Hubo un error al intentar guardar el registro.");
    }
};

    window.actualizar = async () => {
        const id = document.getElementById('edit-id').value;
        const data = obtenerValoresForm();
        await updateDoc(doc(db, "trabajo_social", id), data);
        limpiarForm();
        alert("✅ Registro actualizado correctamente.");
    };

    window.importarDesdeExcel = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true, dateNF: 'yyyy-mm-dd' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false });
                
                let count = 0;
                const batch = writeBatch(db);

                for (const f of json) {
                    const nuevoDoc = {
                        numero_consecutivo: String(f.No || f.numero_consecutivo || proximoNo + count),
                        fecha_registro: String(f.Fecha || f.fecha_registro || ""),
                        nombre: String(f.Nombre || f.nombre || "").toUpperCase(),
                        telefono: String(f.Telefono || f.telefono || ""),
                        direccion: String(f.Direccion || f.direccion || "").toUpperCase(),
                        col_loc: String(f.Col_Loc || f.col_loc || "").toUpperCase(),
                        programa: String(f.Programa || f.programa || "").toUpperCase(),
                        asunto: String(f.Asunto || f.asunto || "").toUpperCase(),
                        horarios_mixtos: String(f["Horarios Mixtos"] || f.horarios_mixtos || "NO").toUpperCase(),
                        folio_expediente: String(f["Folio Expediente"] || f.folio_expediente || ""),
                        estatus: String(f.Estatus || f.estatus || "PENDIENTE").toUpperCase(),
                        detalles: String(f.Detalles || f.detalles || "").toUpperCase(),
                        usuario: String(f.Usuario || f.usuario || "").toUpperCase(),
                        observaciones: String(f.Observaciones || f.observaciones || "").toUpperCase()
                    };
                    const docRef = doc(apoyosRef);
                    batch.set(docRef, nuevoDoc);
                    count++;
                }
                await batch.commit();
                alert(`✅ Se importaron ${count} registros con éxito.`);
            } catch (err) {
                console.error(err);
                alert("Error al procesar el Excel. Verifique el formato.");
            }
        };
        reader.readAsArrayBuffer(file);
    };

   window.filtrar = () => {
        const term = document.getElementById('buscador').value.toLowerCase();
        datosFiltrados = todosLosDatos.filter(r => 
            Object.values(r).some(v => String(v).toLowerCase().includes(term))
        ).sort((a, b) => {
            // Convertimos a número para asegurar el orden matemático correcto
            const numA = parseInt(a.numero_consecutivo) || 0;
            const numB = parseInt(b.numero_consecutivo) || 0;
            return numB - numA; // <--- Cambio aquí: B menos A para orden descendente
        });
        renderTabla();
    };

    function renderTabla() {
        const inicio = (paginaActual - 1) * filasPorPagina;
        const segmento = datosFiltrados.slice(inicio, inicio + filasPorPagina);
        const tbody = document.getElementById('cuerpoTabla');
        
        document.getElementById('info-total').innerText = `TOTAL: ${datosFiltrados.length} REGISTROS`;
        
        tbody.innerHTML = segmento.map(reg => `
            <tr>
                <td><b>${reg.numero_consecutivo}</b></td>
                <td>${reg.fecha_registro || ''}</td>
                <td><b>${reg.nombre}</b></td>
                <td>${reg.col_loc || ''}</td>
                <td><span style="font-size:10px; font-weight:bold; color:#64748b;">${reg.programa || ''}</span></td>
                <td>${reg.asunto || ''}</td>
                <td>${reg.folio_expediente || ''}</td>
                <td><span class="status-badge ${getEstatusClass(reg.estatus)}">${reg.estatus || 'PENDIENTE'}</span></td>
                <td>${reg.usuario || ''}</td>
                <td class="no-print">
                    <button onclick="editarLocal('${reg.id}')" style="border:none; background:none; cursor:pointer; font-size:16px;">✏️</button>
                    <button onclick="eliminarDoc('${reg.id}')" style="border:none; background:none; cursor:pointer; font-size:16px;">🗑️</button>
                </td>
            </tr>
        `).join('');
        
        const totalPags = Math.ceil(datosFiltrados.length / filasPorPagina) || 1;
        document.getElementById('page-info').innerText = `Página ${paginaActual} de ${totalPags}`;
    }

    function getEstatusClass(estatus) {
        if(estatus === 'ENTREGADO') return 'bg-entregado';
        if(estatus === 'REALIZADO') return 'bg-realizado';
        return 'bg-pendiente';
    }

    window.exportarExcel = () => {
        const datosMapeados = datosFiltrados.map(r => ({
            "No": r.numero_consecutivo,
            "Fecha": r.fecha_registro,
            "Nombre": r.nombre,
            "Telefono": r.telefono,
            "Direccion": r.direccion,
            "Col_Loc": r.col_loc,
            "Programa": r.programa,
            "Asunto": r.asunto,
            "Horarios Mixtos": r.horarios_mixtos,
            "Folio Expediente": r.folio_expediente,
            "Estatus": r.estatus,
            "Detalles": r.detalles,
            "Usuario": r.usuario,
            "Observaciones": r.observaciones
        }));
        const ws = XLSX.utils.json_to_sheet(datosMapeados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "TrabajoSocial");
        XLSX.writeFile(wb, `Trabajo_Social_DIF_2026.xlsx`);
    };

    window.editarLocal = (id) => {
        const reg = todosLosDatos.find(r => r.id === id);
        if(!reg) return;

        document.getElementById('edit-id').value = id;
        
        listaCampos.forEach(campo => {
            const input = document.getElementById(campo);
            if(input) {
                input.value = reg[campo] || "";
            }
        });

        document.getElementById('btn-save').style.display = 'none';
        document.getElementById('btn-update').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function obtenerValoresForm() {
        const res = {};
        listaCampos.forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                if(id === 'numero_consecutivo' || id === 'fecha_registro' || id === 'usuario') res[id] = el.value;
                else res[id] = el.value.toUpperCase();
            }
        });
        return res;
    }

    window.limpiarForm = () => {
        listaCampos.forEach(id => {
            const el = document.getElementById(id);
            if(el && id !== "numero_consecutivo") el.value = "";
        });
        document.getElementById('numero_consecutivo').value = proximoNo;
        document.getElementById('edit-id').value = "";
        document.getElementById('btn-save').style.display = 'inline-block';
        document.getElementById('btn-update').style.display = 'none';
    };

    window.eliminarDoc = async (id) => { if(confirm("¿Eliminar registro permanentemente?")) await deleteDoc(doc(db, "trabajo_social", id)); };

    window.eliminarTodoBaseDatos = async () => {
        if(confirm("¿ESTÁS SEGURO DE BORRAR TODO? Esta acción no se puede deshacer.") && prompt("Escribe ELIMINAR para confirmar") === "ELIMINAR") {
            const snap = await getDocs(apoyosRef);
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
            alert("Base de datos vaciada.");
        }
    };
    
    window.cambiarPagina = (dir) => {
        const max = Math.ceil(datosFiltrados.length / filasPorPagina);
        if(paginaActual + dir > 0 && paginaActual + dir <= max) { paginaActual += dir; renderTabla(); }
    };

    window.actualizarFilasPorPagina = () => {
        filasPorPagina = parseInt(document.getElementById('rows-per-page').value);
        paginaActual = 1;
        renderTabla();
    };
</script>
</body>
</html>
