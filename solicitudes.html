<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF 2026 | Solicitudes Generales</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #2563eb; --primary-dark: #1e40af; --success: #059669; 
            --warning: #f59e0b; --danger: #dc2626; --bg: #f8fafc; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: #1e293b; font-size: 13px; }
        header { background: #fff; padding: 15px 40px; border-bottom: 3px solid var(--primary); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .header-title h2 { margin: 0; color: var(--primary); font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .container { max-width: 1850px; margin: 20px auto; padding: 0 20px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        h3 { margin: 0 0 18px 0; font-size: 11px; color: var(--primary); text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; letter-spacing: 1px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 9px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        input, select { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1); }
        
        .btn-box { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 10px; color: white; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: 0.3s; }
        
        .search-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; gap: 15px; align-items: flex-end; }
        .table-wrap { background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1500px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 10px; color: #475569; border-bottom: 2px solid var(--border); text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .sub-text { font-size: 10px; color: #64748b; display: block; margin-top: 2px; }
        
        /* Badges Personalizados */
        .badge-status { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .badge-atendido { background: #dcfce7; color: #15803d; }
        .badge-pendiente { background: #fef3c7; color: #b45309; }
        .badge-noprocede { background: #fee2e2; color: #b91c1c; }

        .paginacion-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print">
    <div class="header-title"><h2><i class="fa-solid fa-list-check"></i> Gestión de Solicitudes Generales</h2></div>
    <button class="btn" style="background: var(--primary)" onclick="location.href='admin_global.html'"><i class="fa-solid fa-house"></i> DASHBOARD</button>
</header>

<div class="container">
    <div class="card no-print">
        <h3><i class="fas fa-plus-circle"></i> Registro de Solicitud</h3>
        <input type="hidden" id="edit-id">
        <div class="form-grid" id="main-form">
            <div class="form-group"><label>No. Folio</label><input type="text" id="no" placeholder="REQ-001"></div>
            <div class="form-group"><label>Fecha</label><input type="date" id="fecha"></div>
            <div class="form-group"><label>Área</label><input type="text" id="area" placeholder="Ej. Educación"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Nombre de la Escuela</label><input type="text" id="nombre_escuela"></div>
            <div class="form-group"><label>Responsable</label><input type="text" id="responsable"></div>
            <div class="form-group"><label>Colonia/Localidad</label><input type="text" id="col_loc"></div>
            <div class="form-group"><label>Teléfono</label><input type="text" id="telefono"></div>
            <div class="form-group">
                <label>Estatus</label>
                <select id="estatus">
                    <option value="PENDIENTE">PENDIENTE</option>
                    <option value="ATENDIDO">ATENDIDO</option>
                    <option value="NO PROCEDE">NO PROCEDE</option>
                </select>
            </div>
            <div class="form-group" style="grid-column: span 2;"><label>Requerimiento</label><input type="text" id="requerimiento"></div>
            <div class="form-group" style="grid-column: span 3;"><label>Observaciones</label><input type="text" id="observaciones"></div>
        </div>

        <div class="btn-box">
            <button class="btn" id="btn-save" style="background:var(--success)" onclick="guardar()"><i class="fas fa-save"></i> GUARDAR REGISTRO</button>
            <button class="btn" id="btn-upd" style="background:var(--warning); display:none;" onclick="actualizar()"><i class="fas fa-sync"></i> ACTUALIZAR</button>
            <button class="btn" style="background:#1d6f42" onclick="exportarExcel()"><i class="fas fa-file-excel"></i> EXPORTAR</button>
            <button class="btn" style="background:#94a3b8" onclick="location.reload()"><i class="fas fa-eraser"></i> LIMPIAR</button>
        </div>
    </div>

    <div class="search-box no-print">
        <div class="form-group" style="flex:2;"><label>🔍 Buscador (Escuela, Responsable, Área)</label><input type="text" id="input-busqueda" onkeyup="filtrarYRender()"></div>
        <div class="form-group" style="flex:1;">
            <label>Filtrar Estatus</label>
            <select id="filtro-estatus" onchange="filtrarYRender()">
                <option value="Todos">TODOS LOS ESTATUS</option>
                <option value="PENDIENTE">PENDIENTE</option>
                <option value="ATENDIDO">ATENDIDO</option>
                <option value="NO PROCEDE">NO PROCEDE</option>
            </select>
        </div>
    </div>

    <div class="paginacion-bar no-print">
        <div id="info-total" style="font-size: 11px; font-weight: bold; color: var(--primary);"></div>
        <div id="pag-container"></div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>NO. FOLIO</th>
                    <th>FECHA</th>
                    <th>COLONIA / LOCALIDAD</th>
                    <th>ESCUELA / RESPONSABLE</th>
                    <th>REQUERIMIENTO</th>
                    <th>TELÉFONO</th>
                    <th>ESTATUS</th>
                    <th class="no-print">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, query, orderBy, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCk6vNVA6mkYzcqdgSBE2akIMVkXYOwq0E", projectId: "poblacion-vulnerable---dif" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colegiosRef = collection(db, "requerimientos_escuelas");

    let DATA_ACTUAL = [];
    let DATA_FILTRADA = [];

  onSnapshot(query(colegiosRef, orderBy("no", "desc")), (snap) => {
    DATA_ACTUAL = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    filtrarYRender();
});

 window.filtrarYRender = () => {
    const busqueda = document.getElementById('input-busqueda').value.toLowerCase();
    const est = document.getElementById('filtro-estatus').value;
    
    // 1. Filtrar los datos según búsqueda y estatus
    DATA_FILTRADA = DATA_ACTUAL.filter(r => {
        const matchTxt = Object.values(r).join(" ").toLowerCase().includes(busqueda);
        const matchEst = (est === "Todos" || r.estatus === est);
        return matchTxt && matchEst;
    });

    // 2. ORDENAR DE MAYOR A MENOR (Basado en el campo 'no')
    // Usamos localeCompare con numeric: true para que entienda que "REQ-10" es mayor que "REQ-2"
    DATA_FILTRADA.sort((a, b) => {
        const valA = String(a.no || "");
        const valB = String(b.no || "");
        return valB.localeCompare(valA, undefined, { numeric: true, sensitivity: 'base' });
    });

    render();
};

    function render() {
        document.getElementById('info-total').innerText = `TOTAL DE REGISTROS: ${DATA_FILTRADA.length}`;
        document.getElementById('tabla-body').innerHTML = DATA_FILTRADA.map(r => `
            <tr>
                <td style="color:var(--primary); font-weight:bold;">${r.no || '-'}</td>
                <td>${r.fecha || '-'}</td>
                <td><b>${r.area || ''}</b><span class="sub-text">${r.col_loc || ''}</span></td>
                <td><b>${r.nombre_escuela || ''}</b><span class="sub-text">Resp: ${r.responsable || ''}</span></td>
                <td><b>${r.requerimiento || ''}</b><span class="sub-text">${r.observaciones || ''}</span></td>
                <td>${r.telefono || '-'}</td>
                <td>
                    <span class="badge-status badge-${(r.estatus || 'pendiente').toLowerCase().replace(/\s/g, "")}">
                        ${r.estatus || 'PENDIENTE'}
                    </span>
                </td>
                <td class="no-print">
                    <button onclick="editar('${r.id}')" style="border:none; background:none; cursor:pointer; font-size:16px;">✏️</button>
                    <button onclick="eliminar('${r.id}')" style="border:none; background:none; cursor:pointer; font-size:16px;">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    window.guardar = async () => {
        const data = {};
        document.querySelectorAll('#main-form input, #main-form select').forEach(i => data[i.id] = i.value.trim());
        if(!data.no || !data.nombre_escuela) return alert("Folio y Nombre de Escuela son obligatorios");
        await addDoc(colegiosRef, data);
        alert("Registro Guardado");
        location.reload();
    };

    window.editar = (id) => {
        const r = DATA_ACTUAL.find(x => x.id === id);
        Object.keys(r).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = r[k]; });
        document.getElementById('edit-id').value = id;
        document.getElementById('btn-save').style.display = 'none';
        document.getElementById('btn-upd').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.actualizar = async () => {
        const id = document.getElementById('edit-id').value;
        const data = {};
        document.querySelectorAll('#main-form input, #main-form select').forEach(i => data[i.id] = i.value.trim());
        await updateDoc(doc(db, "requerimientos_escuelas", id), data);
        alert("Actualizado correctamente");
        location.reload();
    };

    window.eliminar = async (id) => { if(confirm("¿Eliminar este requerimiento?")) await deleteDoc(doc(db, "requerimientos_escuelas", id)); };

    window.exportarExcel = () => {
        const ws = XLSX.utils.json_to_sheet(DATA_FILTRADA);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Requerimientos");
        XLSX.writeFile(wb, "Reporte_Escolar_2026.xlsx");
    };

    window.importarExcel = async (e) => {
        const f = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const data = new Uint8Array(ev.target.result);
            const wb = XLSX.read(data, { type: 'array', cellDates: true });
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            const batch = writeBatch(db);
            
            if(json.length === 0) return alert("El archivo Excel está vacío");

            json.forEach(row => {
                const d = doc(colegiosRef);
                const temp = {};
                
                // Mapeo inteligente de columnas
                Object.keys(row).forEach(key => {
                    let k = key.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ /g, "_");
                    
                    // Diccionario de sinónimos
                    if(["folio", "no.", "numero"].includes(k)) k = "no";
                    if(["escuela", "nombre", "colegio", "institucion"].includes(k)) k = "nombre_escuela";
                    if(["lugar", "colonia", "localidad", "ubicacion", "domicilio"].includes(k)) k = "col_loc";
                    if(["telefono", "tel", "contacto"].includes(k)) k = "telefono";

                    let val = row[key];
                    if(val instanceof Date) val = val.toISOString().split('T')[0];
                    temp[k] = String(val).trim();
                });

                if(temp.no || temp.nombre_escuela) {
                    batch.set(d, {
                        no: temp.no || "S/F",
                        fecha: temp.fecha || new Date().toISOString().split('T')[0],
                        area: temp.area || "",
                        nombre_escuela: temp.nombre_escuela || "",
                        responsable: temp.responsable || "",
                        col_loc: temp.col_loc || "",
                        requerimiento: temp.requerimiento || "",
                        telefono: temp.telefono || "",
                        observaciones: temp.observaciones || "",
                        estatus: (temp.estatus || "PENDIENTE").toUpperCase()
                    });
                }
            });

            await batch.commit();
            alert("¡Importación Finalizada!");
            location.reload();
        };
        reader.readAsArrayBuffer(f);
    };

    window.vaciarBase = async () => {
        if(confirm("¿BORRAR TODO? Esta acción no se puede deshacer.") && prompt("Escribe ELIMINAR") === "ELIMINAR") {
            const snap = await getDocs(colegiosRef);
            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
            location.reload();
        }
    };
</script>
</body>
</html>
