<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Sistema DIF 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1e3a8a;
            --bg: #f1f5f9;
            --danger: #dc2626;
        }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .icon-header { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        h2 { color: var(--primary); margin: 0 0 5px 0; font-size: 1.4rem; letter-spacing: 1px; }
        p { color: #64748b; font-size: 12px; margin-bottom: 25px; font-weight: 500; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #475569; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1); }
        .btn-login {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            font-size: 13px;
        }
        .btn-login:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .error { 
            color: var(--danger); font-size: 13px; margin-top: 15px; display: none; 
            padding: 10px; background: #fef2f2; border-radius: 8px; border: 1px solid #fee2e2;
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .btn-nav {
            background: white; color: #1e40af; border: 1px solid #e2e8f0;  
            padding: 15px 10px; border-radius: 12px; font-size: 11px; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex; flex-direction: column;
            align-items: center; gap: 8px; text-transform: uppercase;
        }
        .btn-nav i { font-size: 1.5rem; }
        .btn-nav:hover { background: #f1f5f9; border-color: #1e40af; transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-header"><i class="fas fa-user-shield"></i></div>
    <h2>SISTEMA DIF</h2>
    <p>PANEL DE CONTROL 2026</p>

    <div class="input-group">
        <label>Usuario</label>
        <input type="text" id="user" placeholder="Ingrese su usuario" autocomplete="off">
    </div>
    <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
    </div>

    <button class="btn-login" onclick="validarAcceso()">
        <i class="fas fa-sign-in-alt"></i> Ingresar al Panel
    </button>
    
    <div id="error-msg" class="error">
        <i class="fas fa-exclamation-circle"></i> Credenciales incorrectas
    </div>
</div>

<script>
    // Permitir ingreso con Enter

   function validarAcceso() {
    const user = document.getElementById('user').value.toLowerCase().trim();
    const pass = document.getElementById('pass').value;
    const error = document.getElementById('error-msg');

    if (cuentas[user] && cuentas[user].p === pass) {
        // 1. GUARDAR DATOS BÁSICOS
        sessionStorage.setItem('sesion_activa', 'true'); 
        sessionStorage.setItem('nombre_usuario', user);
        sessionStorage.setItem('departamento', cuentas[user].dep);

        // 2. MAPEO DE NOMBRES PARA DOCTORES (Para el sistema de luz verde)

     // Dentro de validarAcceso en index.html

        };

if (nombresMedicos[user]) {
    sessionStorage.setItem('nombre_medico', nombresMedicos[user]);
}

        // EFECTO DE CARGA
        const btn = document.querySelector('.btn-login');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';

        // REDIRECCIÓN DIRECTA
        setTimeout(() => {
            window.location.href = cuentas[user].url;
        }, 500);
    } else {
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
    }
}


</script>

</body>
</html>
