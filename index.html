<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Sistema DIF 2026 - 2029</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Colores Institucionales Extraídos de los Logos */
            --primary-dif: #a21caf; /* Magenta / Tinto del corazón institucional */
            --primary-hover: #86198f;
            --accent-gold: #b45309;  /* Dorado / Ocre del escudo de armas */
            --text-dark: #1e293b;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --danger: #dc2626;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--bg-gradient); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        /* Animación de entrada suave */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Banner de logotipos institucionales (Superior) - Optimizado para formato horizontal */
        .brand-header {
            width: 100%;
            max-width: 430px; /* Ampliado para evitar que los logos se compriman en PC */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-sizing: border-box;
            
            /* Animación directa al cargar */
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .brand-logo {
            height: 65px;
            object-fit: contain;
            max-width: 100%;
        }

        /* Contenedor principal de Login */
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(162, 28, 175, 0.06), 0 1px 3px rgba(0,0,0,0.02);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #f1f5f9;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            
            /* Animación con retraso para efecto escalonado */
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0; 
        }

        /* Línea decorativa superior institucional */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-gold), var(--primary-dif));
        }

        /* Eslogan Institucional Inferior */
        .slogan-img {
            width: 180px;
            margin: 0 auto 20px auto;
            display: block;
            object-fit: contain;
        }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 4px 0; 
            font-size: 1.5rem; 
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        p { 
            color: #64748b; 
            font-size: 11px; 
            margin-bottom: 30px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group { margin-bottom: 22px; text-align: left; }
        
        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #475569; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        
        .password-container { position: relative; width: 100%; }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
            color: var(--text-dark);
            transition: all 0.25s ease;
            background-color: #f8fafc;
        }

        input:focus { 
            border-color: var(--primary-dif); 
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(162, 28, 175, 0.15); 
        }
        
        .password-container input { padding-right: 45px; }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--primary-dif); }

        .btn-login {
            background: var(--primary-dif);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(162, 28, 175, 0.2);
        }
        
        .btn-login:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(162, 28, 175, 0.3);
        }
        
        .btn-login:disabled { 
            background: #cbd5e1; 
            color: #94a3b8;
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }

        .error { 
            color: var(--danger); 
            font-size: 12px; 
            margin-top: 20px; 
            display: none; 
            padding: 12px; 
            background: #fef2f2; 
            border-radius: 10px; 
            border: 1px solid #fee2e2;
            font-weight: 600;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @media (max-width: 600px) {
            .brand-header { padding: 15px; margin-bottom: 20px; }
            .brand-logo { height: 45px; }
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="brand-header">
    <img src="Captura_de_pantalla_2026-02-05_a_la_s__10.27.47_a.m.-removebg-preview.png" alt="Logos Institucionales San Andrés Tuxtla" class="brand-logo">
</div>

<div class="login-card">
    <img src="Captura_de_pantalla_2026-02-05_a_la_s__10.28.31_a.m.-removebg-preview.png" alt="Amor que protege" class="slogan-img">
    
    <h2>SISTEMA INTEGRAL</h2>
    <p>Panel de Control 2026</p>

    <div class="input-group">
        <label for="user">Usuario institucional</label>
        <input type="text" id="user" placeholder="ejemplo.usuario" autocomplete="username">
    </div>
    
    <div class="input-group">
        <label for="pass">Contraseña</label>
        <div class="password-container">
            <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
            <i class="fas fa-eye toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"></i>
        </div>
    </div>

    <button class="btn-login" id="btnLogin" onclick="validarAcceso()">
        <i class="fas fa-lock-open"></i> Acceder al Sistema
    </button>
    
    <div id="error-msg" class="error">
        <i class="fas fa-exclamation-circle"></i> Credenciales de acceso incorrectas
    </div>
</div>

<script>
    document.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') {
            validarAcceso(); 
        }
    });

    const cuentas = {
        "admin": { p: "master2026", url: "admin_global.html", dep: "GLOBAL" },
        "lorena.gonzalez": { p: "logoke.15", url: "admin_global.html", dep: "GLOBAL" }, 
        "angel.vidal": { p: "Angel123..", url: "admin_global.html", dep: "GLOBAL" }, 
        "vulnerable": { p: "vul123", url: "vulnerable.html", dep: "VULNERABLE" }, 
        "ramon.guapillo": { p: "Fatima20", url: "vulnerable.html", dep: "VULNERABLE" },
        "social": { p: "soc123", url: "social.html", dep: "SOCIAL" },
        "juanita.campechano": { p: "Juanita123..", url: "social.html", dep: "SOCIAL" }, 
        "monse.plata": { p: "Monse123..", url: "social.html", dep: "SOCIAL" },
        "procuraduria": { p: "pro123", url: "procuraduria.html", dep: "PROCURADURIA" },
        "edmundo.pechi": { p: "Edmundo123..", url: "procuraduria.html", dep: "PROCURADURIA" },
        "recepcion": { p: "medica2026", url: "medica2.html", dep: "MEDICA" },
        "olga.perez": { p: "Olga123..", url: "medica2.html", dep: "MEDICA" },
        "sonia.xala": { p: "Sonia123..", url: "medica2.html", dep: "MEDICA" },
        "enfermeria": { p: "enf123", url: "enfermeria.html", dep: "MEDICA" },
        "guardia.enfermeria": { p: "dif.enf.26", url: "enfermeria.html", dep: "MEDICA" },
        "gael.maldonado": { p: "Gael123..", url: "enfermeria.html", dep: "MEDICA" },
        "francisco.gomez": { p: "Paco123..", url: "enfermeria.html", dep: "MEDICA" },
        "doctor": { p: "doc123", url: "consulta_doctor.html", dep: "MEDICA" },
        "medico.turno": { p: "consulta.2026", url: "consulta_doctor.html", dep: "MEDICA" },
        "hector.gonzalez": { p: "Hector123..", url: "consulta_doctor.html", dep: "MEDICA" },
        "oscar.perrotin": { p: "Oscar123..", url: "consulta_doctor.html", dep: "MEDICA" },
        "director.medico": { p: "dir1234", url: "historial_general.html", dep: "MEDICA" },
        "ronaldo.bencomo": { p: "Ronald123..", url: "historial_general.html", dep: "MEDICA" },
        "farmacia": { p: "far123", url: "farmacia.html", dep: "FARMACIA" },
        "responsable.farma": { p: "farma.dif", url: "farmacia.html", dep: "FARMACIA" },
        "psicologia": { p: "psi123", url: "psicologia.html", dep: "PSICOLOGIA" },
        "samuel.pucheta": { p: "Samuel123..", url: "psicologia.html", dep: "PSICOLOGIA" },
        "veronica.velasco": { p: "Veronica123..", url: "admin_global.html", dep: "PSICOLOGIA" },
        "jefatura.psico": { p: "jefe.psi.2026", url: "jefatura_psicologia.html", dep: "PSICOLOGIA" },
        "localidades": { p: "DIF.gen.loc", url: "general_localidades.html", dep: "LOCALIDADES" },
        "ariana.reyes": { p: "Ariana123..", url: "general_localidades.html", dep: "LOCALIDADES" },
        "escolar": { p: "esc123", url: "solicitudes.html", dep: "ESCOLAR" },
        "apoyo.escolar": { p: "DIF.esc.2026", url: "solicitudes.html", dep: "ESCOLAR" }
    };

    const nombresMedicos = {
        "hector.gonzalez": "DR. HECTOR ARTURO GONZALEZ DOMINGUEZ",
        "oscar.perrotin": "DR. OSCAR ALEXIS PERROTIN ORTEGA" 
    };

    function validarAcceso() {
        const userField = document.getElementById('user');
        const passField = document.getElementById('pass');
        const error = document.getElementById('error-msg');
        const btn = document.getElementById('btnLogin');

        const user = userField.value.toLowerCase().trim();
        const pass = passField.value;

        if (cuentas[user] && cuentas[user].p === pass) {
            error.style.display = 'none';
            
            sessionStorage.setItem('sesion_activa', 'true'); 
            sessionStorage.setItem('nombre_usuario', user);
            sessionStorage.setItem('departamento', cuentas[user].dep);

            if (nombresMedicos[user]) {
                sessionStorage.setItem('nombre_medico', nombresMedicos[user]);
            } else {
                sessionStorage.removeItem('nombre_medico');
            }

            const datosTrabajoSocial = {
                "juanita.campechano": { nombre: "JUANITA C. CAMPECHANO QUEZADA", titulo: "LICDA." },
                "monse.plata": { nombre: "MONSERRAT PLATA FLORES", titulo: "L.S.C." }
            };

            if (datosTrabajoSocial[user]) {
                sessionStorage.setItem('social_nombre', datosTrabajoSocial[user].nombre);
                sessionStorage.setItem('social_titulo', datosTrabajoSocial[user].titulo);
            } else {
                sessionStorage.removeItem('social_nombre');
                sessionStorage.removeItem('social_titulo');
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando...';

            setTimeout(() => {
                window.location.href = cuentas[user].url;
            }, 500);
        } else {
            error.style.display = 'block';
            passField.value = '';
            passField.focus();
            setTimeout(() => { error.style.display = 'none'; }, 4000);
        }
    }

    function togglePasswordVisibility() {
        const passInput = document.getElementById('pass');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }
</script>
</body>
</html>
