<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Sistema DIF 2026 - Edición Navideña Mágica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-dif: #991b1b;       
            --primary-hover: #7f1d1d;     
            --accent-gold: #fbbf24;       
            --accent-green: #15803d;      
            --snow-white: #f8fafc;
            --danger: #dc2626;
        }

        /* --- FONDO NOCTURNO MÁGICO Y LINTERNA --- */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            cursor: default;
        }

        /* Capa de luz móvil tipo linterna cálida */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle 280px at var(--cursor-x, 50%) var(--cursor-y, 50%), rgba(251, 191, 36, 0.18) 0%, rgba(15, 23, 42, 0.25) 70%, rgba(2, 6, 23, 0.45) 100%);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- SANTA CLAUS Y SUS RENOS VOLANDO EN EL CIELO --- */
        .sleigh-flying {
            position: fixed;
            top: 15%;
            left: -150px;
            font-size: 2.2rem;
            color: #fbbf24;
            z-index: 3;
            pointer-events: none;
            animation: flySleigh 18s linear infinite;
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6));
        }

        @keyframes flySleigh {
            0% { transform: translateX(-150px) translateY(0) scale(0.8); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateX(calc(100vw + 200px)) translateY(-40px) scale(1.1); opacity: 0; }
        }

        /* --- SERIE DE LUCES NAVIDEÑAS SUPERIORES --- */
        .christmas-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 15;
            pointer-events: none;
            padding: 0 10px;
        }

        .light-bulb {
            width: 11px;
            height: 15px;
            border-radius: 50%;
            animation: flashLight 1.2s infinite alternate ease-in-out;
            box-shadow: 0 0 10px currentColor;
        }

        .light-bulb:nth-child(odd) { color: #ef4444; background: #ef4444; animation-delay: 0.2s; }
        .light-bulb:nth-child(even) { color: #22c55e; background: #22c55e; animation-delay: 0.6s; }
        .light-bulb:nth-child(3n) { color: #fbbf24; background: #fbbf24; animation-delay: 0.4s; }
        .light-bulb:nth-child(4n) { color: #38bdf8; background: #38bdf8; animation-delay: 0.8s; }

        @keyframes flashLight {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 16px currentColor; }
        }

        /* --- COPOS DE NIEVE CAYENDO --- */
        .snowflake {
            position: fixed;
            top: -10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            animation: fallSnow linear infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes fallSnow {
            0% { transform: translateY(-10px) translateX(0); opacity: 0.9; }
            50% { transform: translateY(50vh) translateX(20px); opacity: 0.5; }
            100% { transform: translateY(105vh) translateX(-20px); opacity: 0; }
        }

        /* --- PAISAJE INFERIOR: PASTO VERDE Y NIEVE 3D --- */
        .winter-landscape {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(to top, #14532d 0%, #16a34a 60%, #f8fafc 100%);
            border-top-left-radius: 50% 25px;
            border-top-right-radius: 50% 25px;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 -5px 20px rgba(22, 163, 74, 0.4);
        }

        /* --- DECORACIONES EN EL PASTO (PINOS, REGALOS Y RENO MÓVIL) --- */
        .landscape-props {
            position: fixed;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
            box-sizing: border-box;
            z-index: 6;
            pointer-events: none;
        }

        .prop-group {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .festive-tree {
            font-size: 2.8rem;
            color: #15803d;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            position: relative;
        }
        
        .festive-tree::before {
            content: '★';
            position: absolute;
            font-size: 1rem;
            color: #fbbf24;
            top: -12px;
            left: 14px;
            animation: glowStar 1.5s infinite alternate;
        }

        @keyframes glowStar {
            from { opacity: 0.4; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.2); text-shadow: 0 0 8px #fbbf24; }
        }

        /* Reno asomándose en el pasto con movimiento suave de cabeza */
        .moving-deer {
            font-size: 2.2rem;
            color: #78350f;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
            animation: moveDeer 4s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes moveDeer {
            0% { transform: translateY(5px) rotate(-5deg); }
            100% { transform: translateY(0px) rotate(5deg); }
        }

        .gift-box {
            font-size: 1.8rem;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
        }
        .gift-red { color: #ef4444; }
        .gift-gold { color: #fbbf24; }
        .gift-blue { color: #38bdf8; }

        /* Banner superior logos */
        .brand-header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out forwards;
            z-index: 12;
        }
        .brand-logo { 
            height: 50px; 
            object-fit: contain; 
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        /* Tarjeta de Login Creativa Navideña */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 34px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 45px -5px rgba(0, 0, 0, 0.7), 0 0 25px rgba(22, 163, 74, 0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 2px solid #16a34a;
            box-sizing: border-box;
            animation: fadeIn 0.6s ease-out 0.1s forwards;
            opacity: 0; 
            position: relative;
            overflow: hidden;
            z-index: 12;
        }

        /* Franja superior festiva tricolor */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ef4444, #16a34a, #fbbf24, #38bdf8);
        }

        .slogan-img {
            width: 130px;
            margin: 0 auto 16px auto;
            display: block;
            object-fit: contain;
            opacity: 0.95;
        }

        .seasonal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f0fdf4;
            color: #15803d;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #dcfce7;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 4px 0; 
            font-size: 1.2rem; 
            font-weight: 700;
        }

        p { 
            color: #78716c; 
            font-size: 10px; 
            margin-bottom: 22px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .input-group { 
            margin-bottom: 16px; 
            text-align: left; 
            position: relative;
        }
        
        .input-icon-container {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a8a29e;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid #d6d3d1;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 13.5px;
            color: var(--text-dark);
            background-color: #fafaf9;
            transition: all 0.2s ease;
        }

        input:focus { 
            border-color: #16a34a; 
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2); 
        }

        input:focus + .input-icon,
        .input-icon-container:focus-within .input-icon {
            color: #16a34a;
        }
        
        .password-container input { 
            padding-right: 44px; 
        }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a8a29e;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: #16a34a; }

        .btn-login {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            letter-spacing: 0.3px;
        }
        
        .btn-login:hover { 
            background: #16a34a; 
        }
        
        .btn-login:disabled { 
            background: #d6d3d1; 
            cursor: not-allowed; 
        }

        .error { 
            color: var(--danger); 
            font-size: 11.5px; 
            margin-top: 14px; 
            display: none; 
            padding: 10px; 
            background: #fef2f2; 
            border-radius: 8px; 
            border: 1px solid #fee2e2;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .landscape-props { display: none; }
        }
    </style>
</head>
<body>

    <!-- Trineo de Santa Claus volando en el cielo -->
    <div class="sleigh-flying">
        <i class="fas fa-sleigh" title="¡Santa Claus vuela!"></i> 🦌🎅
    </div>

    <!-- Serie de Luces Navideñas Superiores -->
    <div class="christmas-lights">
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
        <div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div><div class="light-bulb"></div>
    </div>

    <!-- Copos de Nieve Cayendo -->
    <div class="snowflake" style="left: 10%; animation-duration: 7s; animation-delay: 0s;">❄</div>
    <div class="snowflake" style="left: 25%; animation-duration: 9s; animation-delay: 2s;">❅</div>
    <div class="snowflake" style="left: 40%; animation-duration: 6s; animation-delay: 1s;">❆</div>
    <div class="snowflake" style="left: 60%; animation-duration: 8s; animation-delay: 3s;">❄</div>
    <div class="snowflake" style="left: 75%; animation-duration: 10s; animation-delay: 1.5s;">❅</div>
    <div class="snowflake" style="left: 90%; animation-duration: 7s; animation-delay: 2.5s;">❆</div>

    <!-- Paisaje Inferior: Pasto Verde y Nieve -->
    <div class="winter-landscape"></div>

    <!-- Elementos Decorativos sobre el Pasto (Pinos, Regalos y Reno Mándote Saludos) -->
    <div class="landscape-props">
        <div class="prop-group">
            <div class="festive-tree"><i class="fas fa-tree"></i></div>
            <i class="fas fa-gift gift-box gift-red"></i>
            <div class="moving-deer" title="¡Un reno asomándose!"><i class="fas fa-deer"></i> 🦌</div>
        </div>
        <div class="prop-group">
            <i class="fas fa-gift gift-box gift-blue"></i>
            <div class="festive-tree"><i class="fas fa-tree"></i></div>
            <i class="fas fa-gift gift-box gift-gold"></i>
        </div>
    </div>

    <!-- Contenido Principal Login -->
    <div class="brand-header">
        <img src="Captura_de_pantalla_2026-02-05_a_la_s__10.27.47_a.m.-removebg-preview.png" alt="Logos Institucionales San Andrés Tuxtla" class="brand-logo">
    </div>

    <div class="login-card">
        <div class="seasonal-badge">
            <i class="fas fa-holly-berry"></i> Navidad & Próspero 2027
        </div>

        <img src="Captura_de_pantalla_2026-02-05_a_la_s__10.28.31_a.m.-removebg-preview.png" alt="Amor que protege" class="slogan-img">
        
        <h2>SISTEMA INTEGRAL</h2>
        <p>Panel de Control · Edición Mágica</p>

        <div class="input-group">
            <div class="input-icon-container">
                <input type="text" id="user" placeholder="Usuario institucional" autocomplete="username">
                <i class="fas fa-user input-icon"></i>
            </div>
        </div>
        
        <div class="input-group">
            <div class="password-container input-icon-container">
                <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password">
                <i class="fas fa-lock input-icon"></i>
                <i class="fas fa-eye toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"></i>
            </div>
        </div>

        <button class="btn-login" id="btnLogin" onclick="validarAcceso()">
            <i class="fas fa-arrow-right-to-bracket"></i> Ingresar
        </button>
        
        <div id="error-msg" class="error">
            <i class="fas fa-circle-exclamation"></i> Credenciales incorrectas
        </div>
    </div>

<script>
    /* --- LINTERNA QUE SIGUE AL CURSOR --- */
    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.body.style.setProperty('--cursor-x', `${x}%`);
        document.body.style.setProperty('--cursor-y', `${y}%`);
    });

    document.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') {
            validarAcceso(); 
        }
    });

    const perfilesUsuarios = {
        "juanita.campechano": { nombre: "JUANITA C. CAMPECHANO QUEZADA", titulo: "LIC." },
        "monse.plata": { nombre: "MONSERRAT PLATA FLORES", titulo: "LTS." },
        "social": { nombre: "JUANITA C. CAMPECHANO QUEZADA", titulo: "LIC." },
        "angel.vidal": { nombre: "ANGEL DE JESUS VIDAL ARANGO", titulo: "ING." },
        "lorena.gonzalez": { nombre: "LORENA GONZALEZ KEGEL", titulo: "LIC." },
        "rafael.fararoni": { nombre: "RAFAEL FARARONI MAGAÑA", titulo: "LIC." },
        "admin": { nombre: "ADMINISTRADOR GENERAL", titulo: "ADMIN" }
    };

    const cuentas = {
        "admin": { p: "master2026", url: "admin_global.html", dep: "GLOBAL" },
        "lorena.gonzalez": { p: "logoke.15", url: "admin_global.html", dep: "GLOBAL" }, 
        "angel.vidal": { p: "Angel123..", url: "admin_global.html", dep: "GLOBAL" },
        "rafael.fararoni": { p: "Rafita123..", url: "admin_global.html", dep: "GLOBAL" }, 
        "jornadas.itinerantes": { p: "jornadas2026", url: "Jornadas_itinerantes.html", dep: "JORNADAS" },
        "farmacia_salida": { p: "salidas2026", url: "farmacia_salidas.html", dep: "FARMACIA" },
        "paco.gomez": { p: "Paco123..", url: "farmacia_salidas.html", dep: "FARMACIA" },
        "crisat": { p: "crisat2026", url: "crisat.html", dep: "CRISAT" },
        "monica.delaparra": { p: "Monica123..", url: "crisat.html", dep: "CRISAT" },
        "terapia.crisat": { p: "rehab2026", url: "crisat.html", dep: "CRISAT" },
        "ceci.miros": { p: "Ceci123..", url: "direccion.html", dep: "DIRECCION" },
        "ariana.reyes": { p: "Ariana123..", url: "direccion.html", dep: "DIRECCION" },
        "lupita.montes": { p: "Lupita123..", url: "direccion.html", dep: "DIRECCION" },
        "despensas": { p: "despensa2026", url: "dir_desp.html", dep: "DESPENSAS" },
        "vulnerable": { p: "vul123", url: "vulnerable.html", dep: "VULNERABLE" }, 
        "ramon.guapillo": { p: "Fatima20", url: "registros_entregaspv.html", dep: "VULNERABLE" },
        "dari.nolasco": { p: "Darina123..", url: "registros_entregaspv.html", dep: "VULNERABLE" },
        "social": { p: "soc123", url: "social.html", dep: "SOCIAL" },
        "juanita.campechano": { p: "Juanita123..", url: "social.html", dep: "SOCIAL" }, 
        "monse.plata": { p: "Monse123..", url: "social.html", dep: "SOCIAL" },
        "procuraduria": { p: "pro123", url: "procuraduria.html", dep: "PROCURADURIA" },
        "edmundo.pechi": { p: "Edmundo123..", url: "procuraduria.html", dep: "PROCURADURIA" },
        "recepcion": { p: "medica2026", url: "medica2.html", dep: "MEDICA" },
        "andrea.serrano": { p: "Andy123..", url: "recepcion.html", dep: "RECEPCION" },
        "olga.perez": { p: "Olga123..", url: "medica2.html", dep: "MEDICA" },
        "sonia.xala": { p: "Sonia123..", url: "medica2.html", dep: "MEDICA" },
        "enfermeria": { p: "enf123", url: "enfermeria.html", dep: "MEDICA" },
        "guardia.enfermeria": { p: "dif.enf.26", url: "enfermeria.html", dep: "MEDICA" },
        "gael.maldonado": { p: "Gael123..", url: "enfermeria.html", dep: "MEDICA" },
        "francisco.gomez": { p: "Paco123..", url: "enfermeria.html", dep: "MEDICA" },
        "doctor": { p: "doc123", url: "consulta_doctor.html", dep: "MEDICA" },
        "medico.turno": { p: "consulta.2026", url: "consulta_doctor.html", dep: "MEDICA" },
        "hector.gonzalez": { p: "Hector123..", url: "consulta_doctor.html", dep: "MEDICA" },
        "oscar.perrotin": { p: "Oscar123..", url: "consulta_doctor.html", dep: "MEDICA" },
        "director.medico": { p: "dir1234", url: "historial_general.html", dep: "MEDICA" },
        "ronaldo.bencomo": { p: "Ronald123..", url: "historial_general.html", dep: "MEDICA" },
        "farmacia": { p: "far123", url: "farmacia.html", dep: "FARMACIA" },
        "responsable.farma": { p: "farma.dif", url: "farmacia.html", dep: "FARMACIA" },
        "psicologia": { p: "psi123", url: "psicologia.html", dep: "PSICOLOGIA" },
        "angie.rojas": { p: "Angie123..", url: "psicologia.html", dep: "PSICOLOGIA" },
        "veronica.velasco": { p: "Veronica123..", url: "jefatura_psicologia.html", dep: "PSICOLOGIA" },
        "jefatura.psico": { p: "jefe.psi.2026", url: "jefatura_psicologia.html", dep: "PSICOLOGIA" },
        "localidades": { p: "DIF.gen.loc", url: "general_localidades.html", dep: "LOCALIDADES" },
        "escolar": { p: "esc123", url: "solicitudes.html", dep: "ESCOLAR" },
        "apoyo.escolar": { p: "DIF.esc.2026", url: "solicitudes.html", dep: "ESCOLAR" }
    };

    function validarAcceso() {
        const userField = document.getElementById('user');
        const passField = document.getElementById('pass');
        const error = document.getElementById('error-msg');
        const btn = document.getElementById('btnLogin');

        const user = userField.value.toLowerCase().trim();
        const pass = passField.value;

        if (cuentas[user] && cuentas[user].p === pass) {
            error.style.display = 'none';

            const perfil = perfilesUsuarios[user] || { nombre: user.toUpperCase(), titulo: "LIC." };

            sessionStorage.setItem('sesion_activa', 'true'); 
            sessionStorage.setItem('nombre_usuario', perfil.nombre);
            sessionStorage.setItem('dep_usuario', cuentas[user].dep);
            sessionStorage.setItem('departamento', cuentas[user].dep);
            sessionStorage.setItem('social_nombre', perfil.nombre);
            sessionStorage.setItem('social_titulo', perfil.titulo);
            
            const nombreMostrado = `${perfil.titulo} ${perfil.nombre}`.trim();
            
            localStorage.setItem('activeUser', nombreMostrado);
            localStorage.setItem('userDep', cuentas[user].dep);

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ¡Entrando a la magia navideña...';

            setTimeout(() => {
                window.location.href = cuentas[user].url;
            }, 1000);
        } else {
            error.style.display = 'block';
            passField.value = '';
            passField.focus();
            setTimeout(() => { error.style.display = 'none'; }, 4000);
        }
    }

    function togglePasswordVisibility() {
        const passInput = document.getElementById('pass');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }
</script>

</body>
</html>
