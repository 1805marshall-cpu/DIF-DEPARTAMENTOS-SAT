<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Sistema DIF 2026 - Edición Día de Muertos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-dif: #7c2d12;       
            --primary-hover: #9a3412;     
            --cempasuchil: #f97316;       /* Naranja Cempasúchil */
            --cempasuchil-gold: #facc15;  /* Amarillo Cempasúchil */
            --veladora-purple: #7e22ce;   /* Morado festivo */
            --text-dark: #1c1917;
            --danger: #dc2626;
        }

        /* --- FONDO MÍSTICO NOCTURNO Y LINTERNA --- */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: radial-gradient(circle at center, #3b0764 0%, #150524 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            cursor: default;
        }

        /* Capa de luz móvil tipo veladora */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle 260px at var(--cursor-x, 50%) var(--cursor-y, 50%), rgba(255, 180, 80, 0.18) 0%, rgba(30, 8, 50, 0.25) 70%, rgba(12, 3, 20, 0.4) 100%);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- CAMINO DE FLOR DE CEMPASÚCHIL AMPLIADO (DESDE ABAJO HACIA EL LOGIN) --- */
        .cempasuchil-path {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 240px;
            pointer-events: none;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
        }

        .petal {
            position: absolute;
            background: radial-gradient(circle, var(--cempasuchil-gold) 0%, var(--cempasuchil) 80%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.7);
        }

        /* --- PAPEL PICADO TRADICIONAL SUPERIOR --- */
        .papel-picado {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 32px;
            background-image: repeating-linear-gradient(90deg, 
                #f97316 0px, #f97316 40px, 
                #7e22ce 40px, #7e22ce 80px, 
                #ec4899 80px, #ec4899 120px, 
                #eab308 120px, #eab308 160px);
            opacity: 0.85;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 2px dashed rgba(255,255,255,0.4);
        }

        /* --- MURCIÉLAGOS COLGADOS (DURMIENDO) --- */
        .roost {
            position: fixed;
            top: 32px;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .bat-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
            transition: transform 0.8s ease, opacity 0.8s ease;
        }

        .bat-thread {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.25);
        }

        .bat-svg {
            width: 35px;
            height: 35px;
            fill: #cbd5e1;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
            transform: rotate(180deg);
        }

        .bat-wrapper:nth-child(1) { animation: sway 3s ease-in-out infinite alternate; }
        .bat-wrapper:nth-child(2) { animation: sway 3.8s ease-in-out infinite alternate-reverse; }
        .bat-wrapper:nth-child(3) { animation: sway 3.2s ease-in-out infinite alternate; }
        .bat-wrapper:nth-child(4) { animation: sway 4s ease-in-out infinite alternate-reverse; }

        @keyframes sway {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        .bat-wrapper.flying {
            animation: flyAway 1.4s ease-in-out forwards !important;
        }

        @keyframes flyAway {
            0% { transform: rotate(0deg) translateY(0) scale(1); }
            20% { transform: rotate(180deg) translateY(10px) scale(1.2); }
            100% { transform: translate(var(--rand-x, 150px), -120vh) scale(0.5); opacity: 0; }
        }

        /* --- VELADORAS LATERALES CON PARPADEO --- */
        .veladora-container {
            position: fixed;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 12;
        }
        .veladora-left { left: 40px; }
        .veladora-right { right: 40px; }

        .flame {
            width: 14px;
            height: 24px;
            background: linear-gradient(to top, #ff9100, #ffea00);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.6s infinite alternate ease-in-out;
            box-shadow: 0 0 12px #ff9100, 0 0 25px #ffea00;
            margin-bottom: 2px;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.1) rotate(2deg); opacity: 1; filter: brightness(1.2); }
        }

        .vaso-veladora {
            width: 32px;
            height: 45px;
            background: linear-gradient(135deg, rgba(126,34,206,0.8), rgba(249,115,22,0.8));
            border-radius: 4px 4px 10px 10px;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        /* Banner superior */
        .brand-header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out forwards;
            z-index: 12;
        }
        .brand-logo { 
            height: 50px; 
            object-fit: contain; 
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        /* Tarjeta de Login */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 34px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px -5px rgba(0, 0, 0, 0.7), 0 0 25px rgba(249, 115, 22, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 2px solid #f97316;
            box-sizing: border-box;
            animation: fadeIn 0.6s ease-out 0.1s forwards;
            opacity: 0; 
            position: relative;
            overflow: hidden;
            z-index: 12;
        }

        /* Franja superior tricolor */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #f97316, #7e22ce, #ec4899, #eab308);
        }

        .slogan-img {
            width: 130px;
            margin: 0 auto 16px auto;
            display: block;
            object-fit: contain;
            opacity: 0.95;
        }

        .seasonal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff7ed;
            color: #c2410c;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #fed7aa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 4px 0; 
            font-size: 1.2rem; 
            font-weight: 700;
        }

        p { 
            color: #78716c; 
            font-size: 10px; 
            margin-bottom: 22px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .input-group { 
            margin-bottom: 16px; 
            text-align: left; 
            position: relative;
        }
        
        .input-icon-container {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a8a29e;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid #d6d3d1;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 13.5px;
            color: var(--text-dark);
            background-color: #fafaf9;
            transition: all 0.2s ease;
        }

        input:focus { 
            border-color: var(--cempasuchil); 
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2); 
        }

        input:focus + .input-icon,
        .input-icon-container:focus-within .input-icon {
            color: var(--cempasuchil);
        }
        
        .password-container input { 
            padding-right: 44px; 
        }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a8a29e;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--cempasuchil); }

        .btn-login {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            letter-spacing: 0.3px;
        }
        
        .btn-login:hover { 
            background: var(--cempasuchil); 
        }
        
        .btn-login:disabled { 
            background: #d6d3d1; 
            cursor: not-allowed; 
        }

        .error { 
            color: var(--danger); 
            font-size: 11.5px; 
            margin-top: 14px; 
            display: none; 
            padding: 10px; 
            background: #fef2f2; 
            border-radius: 8px; 
            border: 1px solid #fee2e2;
            font-weight: 500;
        }

        /* --- CALAVERITAS DE AZÚCAR DECORATIVAS ABAJO DE LA TARJETA --- */
        .sugar-skulls-footer {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            z-index: 12;
            animation: fadeIn 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        .sugar-skull {
            font-size: 1.3rem;
            color: #facc15;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            animation: floatSkull 3s ease-in-out infinite alternate;
        }
        .sugar-skull:nth-child(2) { animation-delay: 0.5s; color: #ec4899; }
        .sugar-skull:nth-child(3) { animation-delay: 1s; color: #f97316; }

        @keyframes floatSkull {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        @media (max-width: 768px) {
            .veladora-container, .cempasuchil-path { display: none; }
        }
    </style>
</head>

    function validarAcceso() {
        const userField = document.getElementById('user');
        const passField = document.getElementById('pass');
        const error = document.getElementById('error-msg');
        const btn = document.getElementById('btnLogin');

        const user = userField.value.toLowerCase().trim();
        const pass = passField.value;

        if (cuentas[user] && cuentas[user].p === pass) {
            error.style.display = 'none';

            // --- DESPERTAR MURCIÉLAGOS ---
            const bats = document.querySelectorAll('.bat-wrapper');
            bats.forEach(bat => bat.classList.add('flying'));

            const perfil = perfilesUsuarios[user] || { nombre: user.toUpperCase(), titulo: "LIC." };

            sessionStorage.setItem('sesion_activa', 'true'); 
            sessionStorage.setItem('nombre_usuario', perfil.nombre);
            sessionStorage.setItem('dep_usuario', cuentas[user].dep);
            sessionStorage.setItem('departamento', cuentas[user].dep);
            sessionStorage.setItem('social_nombre', perfil.nombre);
            sessionStorage.setItem('social_titulo', perfil.titulo);
            
            const nombreMostrado = `${perfil.titulo} ${perfil.nombre}`.trim();
            
            localStorage.setItem('activeUser', nombreMostrado);
            localStorage.setItem('userDep', cuentas[user].dep);

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Siguiendo el camino...';

            setTimeout(() => {
                window.location.href = cuentas[user].url;
            }, 1200);
        } else {
            error.style.display = 'block';
            passField.value = '';
            passField.focus();
            setTimeout(() => { error.style.display = 'none'; }, 4000);
        }
    }

    function togglePasswordVisibility() {
        const passInput = document.getElementById('pass');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }
</script>

</body>
