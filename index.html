<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Sistema DIF 2026 - 2029</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-dif: #a21caf; 
            --primary-hover: #86198f;
            --accent-gold: #b45309;  
            --text-dark: #0f172a;
            --bg-color: #f8fafc;
            --danger: #dc2626;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Banner superior discreto */
        .brand-header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out forwards;
        }
        .brand-logo { 
            height: 50px; 
            object-fit: contain; 
        }

        /* Tarjeta de Login Minimalista */
        .login-card {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
            animation: fadeIn 0.6s ease-out 0.1s forwards;
            opacity: 0; 
        }

        .slogan-img {
            width: 140px;
            margin: 0 auto 24px auto;
            display: block;
            object-fit: contain;
            opacity: 0.9;
        }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 6px 0; 
            font-size: 1.25rem; 
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        p { 
            color: #64748b; 
            font-size: 10px; 
            margin-bottom: 28px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .input-group { 
            margin-bottom: 18px; 
            text-align: left; 
            position: relative;
        }
        
        .input-icon-container {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 13.5px;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        input:focus { 
            border-color: var(--primary-dif); 
            box-shadow: 0 0 0 3px rgba(162, 28, 175, 0.08); 
        }

        input:focus + .input-icon,
        .input-icon-container:focus-within .input-icon {
            color: var(--primary-dif);
        }
        
        .password-container input { 
            padding-right: 44px; 
        }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--primary-dif); }

        .btn-login {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            letter-spacing: 0.3px;
        }
        
        .btn-login:hover { 
            background: var(--primary-dif); 
        }
        
        .btn-login:disabled { 
            background: #cbd5e1; 
            cursor: not-allowed; 
        }

        .error { 
            color: var(--danger); 
            font-size: 11.5px; 
            margin-top: 16px; 
            display: none; 
            padding: 10px; 
            background: #fef2f2; 
            border-radius: 8px; 
            border: 1px solid #fee2e2;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <img src="Captura_de_pantalla_2026-02-05_a_la_s__10.27.47_a.m.-removebg-preview.png" alt="Logos Institucionales San Andrés Tuxtla" class="brand-logo">
    </div>

    <div class="login-card">
        <img src="Captura_de_pantalla_2026-02-05_a_la_s__10.28.31_a.m.-removebg-preview.png" alt="Amor que protege" class="slogan-img">
        
        <h2>SISTEMA INTEGRAL</h2>
        <p>Panel de Control 2026</p>

        <div class="input-group">
            <div class="input-icon-container">
                <input type="text" id="user" placeholder="Usuario institucional" autocomplete="username">
                <i class="fas fa-user input-icon"></i>
            </div>
        </div>
        
        <div class="input-group">
            <div class="password-container input-icon-container">
                <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password">
                <i class="fas fa-lock input-icon"></i>
                <i class="fas fa-eye toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"></i>
            </div>
        </div>

        <button class="btn-login" id="btnLogin" onclick="validarAcceso()">
            <i class="fas fa-arrow-right-to-bracket"></i> Ingresar
        </button>
        
        <div id="error-msg" class="error">
            <i class="fas fa-circle-exclamation"></i> Credenciales incorrectas
        </div>
    </div>

    <script>
        document.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') {
                validarAcceso(); 
            }
        });

        const cuentas = {
            "admin": { p: "master2026", url: "admin_global.html", dep: "GLOBAL" },
            "lorena.gonzalez": { p: "logoke.15", url: "admin_global.html", dep: "GLOBAL" }, 
            "angel.vidal": { p: "Angel123..", url: "admin_global.html", dep: "GLOBAL" }, 
            
            /* CUENTAS AGREGADAS PARA CRISAT */
            "crisat": { p: "crisat2026", url: "crisat.html", dep: "CRISAT" },
            "monica.delaparra": { p: "Monica123..", url: "crisat.html", dep: "CRISAT" },
            "terapia.crisat": { p: "rehab2026", url: "crisat.html", dep: "CRISAT" },

            /* CUENTAS AGREGADAS PARA   DIRECCION */
            "ceci.miros": { p: "Ceci123..", url: "direccion.html", dep: "DIRECCION" },
            "ariana.reyes": { p: "Ariana123..", url: "direccion.html", dep: "DIRECCION" },
            "lupita.montes": { p: "Lupita123..", url: "direccion.html", dep: "DIRECCION" },

            /* CUENTA AGREGADA PARA DIRECCIÓN DE DESPENSAS */
            "despensas": { p: "despensa2026", url: "dir_desp.html", dep: "DESPENSAS" },

            "vulnerable": { p: "vul123", url: "vulnerable.html", dep: "VULNERABLE" }, 
            "ramon.guapillo": { p: "Fatima20", url: "vulnerable.html", dep: "VULNERABLE" },
            "social": { p: "soc123", url: "social.html", dep: "SOCIAL" },
            "juanita.campechano": { p: "Juanita123..", url: "social.html", dep: "SOCIAL" }, 
            "monse.plata": { p: "Monse123..", url: "social.html", dep: "SOCIAL" },
            "procuraduria": { p: "pro123", url: "procuraduria.html", dep: "PROCURADURIA" },
            "edmundo.pechi": { p: "Edmundo123..", url: "procuraduria.html", dep: "PROCURADURIA" },
            "recepcion": { p: "medica2026", url: "medica2.html", dep: "MEDICA" },
            "andrea.serrano": { p: "Andy123..", url: "recepcion.html", dep: "RECEPCION" },
            "olga.perez": { p: "Olga123..", url: "medica2.html", dep: "MEDICA" },
            "sonia.xala": { p: "Sonia123..", url: "medica2.html", dep: "MEDICA" },
            "enfermeria": { p: "enf123", url: "enfermeria.html", dep: "MEDICA" },
            "guardia.enfermeria": { p: "dif.enf.26", url: "enfermeria.html", dep: "MEDICA" },
            "gael.maldonado": { p: "Gael123..", url: "enfermeria.html", dep: "MEDICA" },
            "francisco.gomez": { p: "Paco123..", url: "enfermeria.html", dep: "MEDICA" },
            "doctor": { p: "doc123", url: "consulta_doctor.html", dep: "MEDICA" },
            "medico.turno": { p: "consulta.2026", url: "consulta_doctor.html", dep: "MEDICA" },
            "hector.gonzalez": { p: "Hector123..", url: "consulta_doctor.html", dep: "MEDICA" },
            "oscar.perrotin": { p: "Oscar123..", url: "consulta_doctor.html", dep: "MEDICA" },
            "director.medico": { p: "dir1234", url: "historial_general.html", dep: "MEDICA" },
            "ronaldo.bencomo": { p: "Ronald123..", url: "historial_general.html", dep: "MEDICA" },
            "farmacia": { p: "far123", url: "farmacia.html", dep: "FARMACIA" },
            "responsable.farma": { p: "farma.dif", url: "farmacia.html", dep: "FARMACIA" },
            "psicologia": { p: "psi123", url: "psicologia.html", dep: "PSICOLOGIA" },
            "samuel.pucheta": { p: "Samuel123..", url: "psicologia.html", dep: "PSICOLOGIA" },
            "veronica.velasco": { p: "Veronica123..", url: "jefatura_psicologia.html", dep: "PSICOLOGIA" },
            "jefatura.psico": { p: "jefe.psi.2026", url: "jefatura_psicologia.html", dep: "PSICOLOGIA" },
            "localidades": { p: "DIF.gen.loc", url: "general_localidades.html", dep: "LOCALIDADES" },
            "escolar": { p: "esc123", url: "solicitudes.html", dep: "ESCOLAR" },
            "apoyo.escolar": { p: "DIF.esc.2026", url: "solicitudes.html", dep: "ESCOLAR" }
        };

        const nombresMedicos = {
            "hector.gonzalez": "DR. HECTOR ARTURO GONZALEZ DOMINGUEZ",
            "oscar.perrotin": "DR. OSCAR ALEXIS PERROTIN ORTEGA" 
        };

        const datosPersonalStaff = {
            "andre.serrano": { nombre: "ANDREA SERRANO SALAZAR", titulo: "BIENVENIDA" },
            "juanita.campechano": { nombre: "JUANITA C. CAMPECHANO QUEZADA", titulo: "LICDA." },
            "monse.plata": { nombre: "MONSERRAT PLATA FLORES", titulo: "L.T.S." }
        };

        function validarAcceso() {
            const userField = document.getElementById('user');
            const passField = document.getElementById('pass');
            const error = document.getElementById('error-msg');
            const btn = document.getElementById('btnLogin');

            const user = userField.value.toLowerCase().trim();
            const pass = passField.value;

            if (cuentas[user] && cuentas[user].p === pass) {
                error.style.display = 'none';
                
                sessionStorage.setItem('sesion_activa', 'true'); 
                sessionStorage.setItem('nombre_usuario', user);
                sessionStorage.setItem('departamento', cuentas[user].dep);
                
                localStorage.setItem('activeUser', user);
                localStorage.setItem('userDep', cuentas[user].dep);

                if (nombresMedicos[user]) {
                    sessionStorage.setItem('nombre_medico', nombresMedicos[user]);
                } else {
                    sessionStorage.removeItem('nombre_medico');
                }

                if (datosPersonalStaff[user]) {
                    sessionStorage.setItem('social_nombre', datosPersonalStaff[user].nombre);
                    sessionStorage.setItem('social_titulo', datosPersonalStaff[user].titulo);
                    sessionStorage.setItem('nombre_completo_saludo', datosPersonalStaff[user].nombre);
                } else {
                    sessionStorage.removeItem('social_nombre');
                    sessionStorage.removeItem('social_titulo');
                    sessionStorage.removeItem('nombre_completo_saluzdo');
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando...';

                setTimeout(() => {
                    window.location.href = cuentas[user].url;
                }, 400);
            } else {
                error.style.display = 'block';
                passField.value = '';
                passField.focus();
                setTimeout(() => { error.style.display = 'none'; }, 4000);
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('pass');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
