<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Sistema DIF 2026 - Edición Especial Halloween</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-dif: #7c2d12;       
            --primary-hover: #9a3412;     
            --accent-gold: #d97706;       /* Naranja cempasúchil / calabaza */
            --accent-purple: #581c87;     /* Morado místico */
            --text-dark: #1c1917;
            --danger: #dc2626;
        }

        /* --- FONDO CLARO Y EFECTO LINTERNA SUAVE --- */
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: radial-gradient(circle at center, #2e1065 0%, #15092a 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            cursor: default;
        }

        /* Capa de luz móvil más suave y transparente */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle 260px at var(--cursor-x, 50%) var(--cursor-y, 50%), rgba(255, 215, 130, 0.15) 0%, rgba(20, 10, 35, 0.2) 70%, rgba(10, 5, 20, 0.35) 100%);
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- MURCIÉLAGOS COLGADOS (NATIVOS SVG) --- */
        .roost {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            z-index: 20;
            pointer-events: none;
        }

        .bat-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
            transition: transform 0.8s ease, opacity 0.8s ease;
        }

        .bat-thread {
            width: 1px;
            height: 25px;
            background: rgba(255, 255, 255, 0.25);
        }

        .bat-svg {
            width: 38px;
            height: 38px;
            fill: #e2e8f0;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
            transform: rotate(180deg); /* Colgados de cabeza */
            transition: all 0.4s ease;
        }

        /* Balanceo suave de murciélagos al estar colgados */
        .bat-wrapper:nth-child(1) { animation: sway 3s ease-in-out infinite alternate; }
        .bat-wrapper:nth-child(2) { animation: sway 3.8s ease-in-out infinite alternate-reverse; }
        .bat-wrapper:nth-child(3) { animation: sway 3.2s ease-in-out infinite alternate; }
        .bat-wrapper:nth-child(4) { animation: sway 4s ease-in-out infinite alternate-reverse; }

        @keyframes sway {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* Clase cuando despiertan y vuelan al iniciar sesión */
        .bat-wrapper.flying {
            animation: flyAway 1.4s ease-in-out forwards !important;
        }

        @keyframes flyAway {
            0% { transform: rotate(0deg) translateY(0) scale(1); }
            20% { transform: rotate(180deg) translateY(10px) scale(1.2); }
            100% { transform: translate(var(--rand-x, 150px), -120vh) scale(0.5); opacity: 0; }
        }

        /* Telarañas en esquinas */
        .cobweb {
            position: fixed;
            width: 130px;
            height: 130px;
            pointer-events: none;
            opacity: 0.35;
            z-index: 2;
            background-repeat: no-repeat;
        }
        .cobweb-tl { top: 0; left: 0; background-image: radial-gradient(circle at 0 0, #fff 70%, transparent 71%); border-bottom-right-radius: 100%; }
        .cobweb-tr { top: 0; right: 0; background-image: radial-gradient(circle at 100% 0, #fff 70%, transparent 71%); border-bottom-left-radius: 100%; }

        /* Araña colgante */
        .spider-container {
            position: absolute;
            top: 0;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 6;
            animation: hangSpider 4s ease-in-out infinite;
        }

        .spider-thread {
            width: 1px;
            height: 70px;
            background: rgba(255, 255, 255, 0.4);
        }

        .spider-icon {
            color: #1c1917;
            font-size: 1.4rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        @keyframes hangSpider {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }

        /* Banner superior */
        .brand-header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out forwards;
            z-index: 4;
        }
        .brand-logo { 
            height: 50px; 
            object-fit: contain; 
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        /* Tarjeta de Login estilo Calabaza / Halloween */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 34px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px -5px rgba(0, 0, 0, 0.6), 0 0 20px rgba(217, 119, 6, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 2px solid rgba(217, 119, 6, 0.6);
            box-sizing: border-box;
            animation: fadeIn 0.6s ease-out 0.1s forwards;
            opacity: 0; 
            position: relative;
            overflow: hidden;
            z-index: 4;
        }

        /* Franja superior temática */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #d97706, #7c2d12, #581c87);
        }

        .slogan-img {
            width: 130px;
            margin: 0 auto 16px auto;
            display: block;
            object-fit: contain;
            opacity: 0.9;
        }

        .seasonal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff7ed;
            color: #c2410c;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: 1px solid #ffedd5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 4px 0; 
            font-size: 1.2rem; 
            font-weight: 700;
        }

        p { 
            color: #78716c; 
            font-size: 10px; 
            margin-bottom: 22px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .input-group { 
            margin-bottom: 16px; 
            text-align: left; 
            position: relative;
        }
        
        .input-icon-container {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a8a29e;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid #d6d3d1;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 13.5px;
            color: var(--text-dark);
            background-color: #fafaf9;
            transition: all 0.2s ease;
        }

        input:focus { 
            border-color: var(--accent-gold); 
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2); 
        }

        input:focus + .input-icon,
        .input-icon-container:focus-within .input-icon {
            color: var(--accent-gold);
        }
        
        .password-container input { 
            padding-right: 44px; 
        }
        
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a8a29e;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--accent-gold); }

        .btn-login {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            letter-spacing: 0.3px;
        }
        
        .btn-login:hover { 
            background: var(--accent-gold); 
        }
        
        .btn-login:disabled { 
            background: #d6d3d1; 
            cursor: not-allowed; 
        }

        .error { 
            color: var(--danger); 
            font-size: 11.5px; 
            margin-top: 14px; 
            display: none; 
            padding: 10px; 
            background: #fef2f2; 
            border-radius: 8px; 
            border: 1px solid #fee2e2;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .login-card { padding: 24px 18px; }
        }
    </style>
</head>
<body>

<script>

    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.body.style.setProperty('--cursor-x', `${x}%`);
        document.body.style.setProperty('--cursor-y', `${y}%`);
    });

    document.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') {
            validarAcceso();

    });

    };

    function validarAcceso() {
        const userField = document.getElementById('user');
        const passField = document.getElementById('pass');
        const error = document.getElementById('error-msg');
        const btn = document.getElementById('btnLogin');

        const user = userField.value.toLowerCase().trim();
        const pass = passField.value;

        if (cuentas[user] && cuentas[user].p === pass) {
            error.style.display = 'none';

            // --- ANIMAR MURCIÉLAGOS VOLANDO ---
            const bats = document.querySelectorAll('.bat-wrapper');
            bats.forEach(bat => bat.classList.add('flying'));

            const perfil = perfilesUsuarios[user] || { nombre: user.toUpperCase(), titulo: "LIC." };

            sessionStorage.setItem('sesion_activa', 'true'); 
            sessionStorage.setItem('nombre_usuario', perfil.nombre);
            sessionStorage.setItem('dep_usuario', cuentas[user].dep);
            sessionStorage.setItem('departamento', cuentas[user].dep);
            sessionStorage.setItem('social_nombre', perfil.nombre);
            sessionStorage.setItem('social_titulo', perfil.titulo);
            
            const nombreMostrado = `${perfil.titulo} ${perfil.nombre}`.trim();
            
            localStorage.setItem('activeUser', nombreMostrado);
            localStorage.setItem('userDep', cuentas[user].dep);

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando...';

            setTimeout(() => {
                window.location.href = cuentas[user].url;
            }, 1200);
        } else {
            error.style.display = 'block';
            passField.value = '';
            passField.focus();
            setTimeout(() => { error.style.display = 'none'; }, 4000);
        }
    }

    function togglePasswordVisibility() {
        const passInput = document.getElementById('pass');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }
</script>
